# Factory configuration. Version-controlled; agents may not edit it.
# See SPEC.md "Harness adapters and model routing" and "Budgets".

repo: claptimes5/factory     # or repos: [owner/a, owner/b]; see "Several repositories" in the README
base_branch: main
data_dir: ./data              # SQLite db, job logs, scratch workdirs

intake:
  label: "factory:ready"      # issues with this label become work items
  poll_interval: 60s

web:
  listen: 127.0.0.1:8080      # control room; use a Tailscale IP for phone access

runner:
  kind: docker                # docker | local (local runs CLIs on the host; dev only)
  image: factory-job:latest   # built from deploy/job-image
  network: ""                 # set to an egress-allowlisted Docker network
  cpus: "2"
  memory: 4g

routing:
  orchestrate:       {harness: claude, model: opus}
  triage:            {harness: claude, model: haiku}
  implement.S:       {harness: claude, model: sonnet}
  implement.M:       {harness: claude, model: sonnet}
  implement.L:       {harness: claude, model: opus}
  review:            {harness: codex,  model: gpt-5-codex}
  review.high_risk:  {harness: codex,  model: gpt-5-codex, effort: high}
  # Any entry may name a skill set: a folder under skills/ mounted read-only
  # as the worker's skills directory, e.g.
  #   implement.M: {harness: claude, model: sonnet, skills: baseline}

escalation:
  implement: [sonnet, opus]
  max_attempts_per_tier: 2
  max_review_rounds: 2

timeouts:
  triage: 10m
  implement: 60m
  review: 20m
  gates: 20m
  orchestrate: 20m

orchestrator:
  enabled: true
  run_budget: 3               # dollars per run
  daily_budget: 15            # orchestration only, separate from build spend
  daily_issue_cap: 10
  interval: 60m
  summary_hour: 8             # local time of the daily summary
  notify_per_hour: 6

budgets:
  per_job: {S: 2, M: 6, L: 15}
  triage: 0.5
  review: 3
  daily_total: 60
  concurrent_jobs: 3
  awaiting_human_max: 5

# Codex does not report dollar cost, so the daemon prices its token usage.
pricing:
  gpt-5-codex: {input_per_mtok: 1.25, output_per_mtok: 10}

# Deterministic gates, run by the daemon in the job container after the
# builder stops. A required gate with no command is MISCONFIGURED and fails.
gates:
  required: [types, lint, test, build]
  commands:
    types: go vet ./...
    lint: golangci-lint run ./...
    test: go test -race ./...
    build: go build ./...
    audit: ""
  # Revert the code, keep the changed tests: they must fail. {pkgs} becomes
  # the packages holding changed tests. Empty disables the check.
  proves_fix: go test -count=1 {pkgs}
  # Hidden end-to-end scenarios, kept outside the repo so builders never see them.
  # scenarios_dir: /etc/factory/scenarios
  diff_guard:
    max_changed_lines: 400
    # The factory's own controls, and files that steer agents that later
    # read the checkout (the reviewer and critic).
    protected_paths: [".github/", "factory.yaml", ".golangci.yml", "prompts/", "skills/", "CODEOWNERS",
                      ".claude/", "CLAUDE.md", "AGENTS.md", "AGENTS.override.md", ".codex/", ".mcp.json"]

        harness: { type: string }
        window: { type: string, description: "5h, weekly, or the CLI's own name" }
        used_percent: { type: number }
        resets_at: { type: string, description: "When it resets; empty when unknown" }
        seen_at: { type: string }
    Spend:
      type: object
      required: [days, week_usd, daily_cap_usd, by_model, usage, estimates]
      properties:
        days: { type: array, items: { $ref: "#/components/schemas/DaySpend" } }
        week_usd: { type: number }
        daily_cap_usd: { type: number }
        by_model: { type: array, items: { $ref: "#/components/schemas/ModelSpend" } }
        usage: { type: array, items: { $ref: "#/components/schemas/Usage" } }
        estimates: { $ref: "#/components/schemas/Estimates" }
    Notification:
      type: object
      required: [id, kind, title, detail, item_id, at, choice_job_id, choices]
      properties:
        id: { type: string }
        kind: { type: string, enum: [needs_input, ready_for_review, budget] }
        title: { type: string }
        detail: { type: string }
        item_id: { type: [integer, "null"] }
        at: { type: string }
        choice_job_id: { type: [integer, "null"], description: "For a parked item, the job its choices act on" }
        choices: { type: array, items: { $ref: "#/components/schemas/Choice" } }
    Push:
      type: object
      required: [available, public_key, devices]
      properties:
        available: { type: boolean }
        public_key: { type: string, description: "The VAPID key (applicationServerKey), base64url" }
        devices: { type: array, items: { $ref: "#/components/schemas/PushDevice" } }
    PushDevice:
      type: object
      required: [id, agent, created_at, failed_at]
      properties:
        id: { type: string, description: "A hash of the device's endpoint" }
        agent: { type: string }
        created_at: { type: string }
        failed_at: { type: string, description: "When the last push to it failed; empty after one that worked" }
    Trust:
      type: object
      required: [levels, repos, always_asks, window_days, can_change, reason, pending]
      properties:
        levels: { type: array, items: { $ref: "#/components/schemas/TrustLevel" } }
        repos: { type: array, items: { $ref: "#/components/schemas/RepoTrust" } }
        always_asks: { type: array, items: { type: string }, description: "Kinds of change that wait for a person at every level (risk.needs_person)" }
        window_days: { type: integer, description: How far back the record and practice runs look }
        can_change: { type: boolean }
        reason: { type: string, description: "Why a level can't be changed here, or empty" }
        pending: { type: boolean, description: "factory.yaml changed since the factory started: a new level applies once it restarts" }
    TrustLevel:
      type: object
      required: [level, name, detail, up_to, max_size, available, needs, evidence]
      properties:
        level: { type: integer }
        name: { type: string }
        detail: { type: string }
        up_to: { type: string, description: "The level's auto_merge.up_to: none, low or medium" }
        max_size: { type: string }
        available: { type: boolean, description: The factory can work at this level today }
        needs: { type: string, description: "What a level not built yet would take, or empty" }
        evidence: { type: integer, description: "Changes it would have merged in the window, none gone wrong, before it's suggested" }
    RepoTrust:
      type: object
      required: [repo, level, custom, stepped_back, why, merged, automatic, reverted, broke_main, practice, proposed, accepted, sources, suggest, suggest_why]
      properties:
        proposed: { type: integer, description: "Level 6's record: issues the factory filed from its own findings in the window" }
        accepted: { type: integer, description: "Of those, how many a person took on (or level 6 started)" }
        sources: { type: array, items: { type: string }, description: "What starts on its own at level 6 (self_start.sources)" }
        repo: { type: string }
        level: { type: integer }
        custom: { type: boolean, description: "auto_merge is set by hand between levels; level is the highest it covers" }
        stepped_back: { type: boolean, description: "The breaker turned auto-merge off: level 1 until it's reset" }
        why: { type: string }
        merged: { type: integer }
        automatic: { type: integer, description: Merged by auto-merge }
        reverted: { type: integer }
        broke_main: { type: integer }
        practice: { type: array, items: { $ref: "#/components/schemas/Practice" } }
        suggest: { type: integer, description: "A level the record supports above the current one, or 0" }
        suggest_why: { type: string }
    Practice:
      type: object
      required: [level, would_merge, went_wrong]
      properties:
        level: { type: integer }
        would_merge: { type: integer, description: "Merged factory PRs in the window this level would have merged on its own" }
        went_wrong: { type: integer, description: "Of those, how many were reverted or broke main" }
    Home:
      type: object
      required: [seen_at, went_live]
      properties:
        seen_at: { type: string, description: "When Home was last marked seen; empty before the first time" }
        went_live: { type: array, description: "Items done since then, newest first, at most 20", items: { $ref: "#/components/schemas/Item" } }
    Notifications:
      type: object
      required: [notifications]
      properties:
        notifications: { type: array, items: { $ref: "#/components/schemas/Notification" } }
    Group:
      type: object
      required: [key, merged, cost_usd, cost_per_pr_usd]
      properties:
        key: { type: string }
        merged: { type: integer }
        cost_usd: { type: number }
        cost_per_pr_usd: { type: number }
    Week:
      type: object
      required: [start, merged, cost_usd, cost_per_merged_usd, implemented, first_pass_rate, escalation_rate]
      properties:
        start: { type: string, description: The Monday that starts the week }
        merged: { type: integer }
        cost_usd: { type: number }
        cost_per_merged_usd: { type: number }
        implemented: { type: integer }
        first_pass_rate: { type: number, description: "0..1, or -1 with no data" }
        escalation_rate: { type: number, description: "0..1, or -1 with no data" }
    Precision:
      type: object
      required: [key, findings, fixed, refuted, precision]
      properties:
        key: { type: string, description: "The reviewer's route and harness/model" }
        findings: { type: integer }
        fixed: { type: integer }
        refuted: { type: integer }
        precision: { type: number, description: "0..1, or -1 with no data" }
    Metrics:
      type: object
      required: [items, merged, closed, parked, cost_per_merged_usd, by_complexity, by_model, first_pass_rate, escalation_rate, review_blocks, security_passes, security_blocks, review_escape_rate, review_precision, precision_by_reviewer, verifier_refute_rate, rounds_to_pass, revert_window_days, revert_merged, reverted, revert_rate, broke_main, reverts_by_repo, risk_raised_by_diff, awaiting_human_hours, awaiting_human_mean_hours, weekly]
      properties:
        items: { type: integer }
        merged: { type: integer }
        closed: { type: integer }
        parked: { type: integer }
        cost_per_merged_usd: { type: number }
        by_complexity: { type: array, items: { $ref: "#/components/schemas/Group" } }
        by_model: { type: array, items: { $ref: "#/components/schemas/Group" } }
        first_pass_rate: { type: number }
        escalation_rate: { type: number }
        review_blocks: { type: integer }
        security_passes: { type: integer, description: "Security passes that ran to a verdict" }
        security_blocks: { type: integer, description: "Review rounds that blocked on a security pass's finding the verifier didn't refute" }
        review_escape_rate: { type: number }
        review_precision: { type: number, description: "Share of settled blocking findings that led to a fix, 0..1, or -1 with no data" }
        precision_by_reviewer: { type: array, items: { $ref: "#/components/schemas/Precision" } }
        verifier_refute_rate: { type: number, description: "Share of checked findings the verifier refuted, 0..1, or -1" }
        rounds_to_pass: { type: number, description: "Mean review rounds of items that passed review, or -1" }
        revert_window_days: { type: integer, description: "The days the revert rate covers" }
        revert_merged: { type: integer, description: "Factory PRs merged in that window" }
        reverted: { type: integer, description: "Of those, how many a later commit or PR reverted" }
        revert_rate: { type: number, description: "reverted / revert_merged: 0..1, or -1 with no data" }
        broke_main: { type: integer, description: "Of those, how many main health saw a check go red on" }
        reverts_by_repo: { type: array, items: { $ref: "#/components/schemas/RepoReverts" } }
        risk_raised_by_diff: { type: integer, description: "Items whose built diff raised their risk above triage's" }
        awaiting_human_hours: { type: number }
        awaiting_human_mean_hours: { type: number }
        weekly: { type: array, items: { $ref: "#/components/schemas/Week" } }
    RepoReverts:
      type: object
      required: [repo, merged, reverted, revert_rate, broke_main]
      properties:
        repo: { type: string }
        merged: { type: integer }
        reverted: { type: integer }
        revert_rate: { type: number, description: "0..1, or -1 with no data" }
        broke_main: { type: integer }
    SettingValue:
      description: A number, text, true or false, or a list of names; null when unset
      type: [number, string, boolean, array, "null"]
      items: { type: string }
    Setting:
      type: object
      required: [path, label, help, kind, options, row, value, default]
      properties:
        path: { type: array, items: { type: string }, description: "One key per level: [routing, implement.S, model]" }
        label: { type: string }
        help: { type: string }
        kind: { type: string, enum: [number, integer, text, bool, select, list, duration] }
        options: { type: array, items: { type: string }, description: "A select's choices; an empty one means the default" }
        row: { type: string, description: "The routing entry it belongs to, or empty" }
        value: { $ref: "#/components/schemas/SettingValue" }
        default: { $ref: "#/components/schemas/SettingValue" }
    SettingsGroup:
      type: object
      required: [name, help, fields]
      properties:
        name: { type: string }
        help: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/Setting" } }
    Settings:
      type: object
      required: [path, writable, reason, version, changed, restart_pending, restart_waits_for, running_jobs, groups, presets, preset, builder, reviewer, harnesses, warnings]
      properties:
        path: { type: string, description: The config file }
        writable: { type: boolean }
        reason: { type: string, description: "Why settings can't be changed here; empty when they can" }
        version: { type: string, description: Changes whenever the file does }
        changed: { type: boolean, description: The file differs from the one the factory started with }
        restart_pending: { type: boolean }
        restart_waits_for: { type: string, description: "Other work the pending restart waits for, such as \"the job image build\" or \"the Codex sign-in\"; else empty" }
        running_jobs: { type: integer }
        groups: { type: array, items: { $ref: "#/components/schemas/SettingsGroup" } }
        presets: { type: array, description: "How hard the factory works, least first", items: { $ref: "#/components/schemas/Preset" } }
        preset: { type: string, description: "The preset the file matches; empty when its settings were changed by hand" }
        builder: { type: string, description: The harness that builds }
        reviewer: { type: string, description: "The harness that reviews; the builder's with only one" }
        harnesses: { type: array, items: { type: string }, description: "Harnesses with a key or sign-in, which routes may name" }
        warnings: { type: array, items: { type: string }, description: "What the file loads with but is worth a second look, such as the security pass on a reviewer's model" }
    SettingsCheck:
      type: object
      required: [error, warnings]
      properties:
        error: { type: string, description: "Why a save would be refused, one problem a line; empty when it would load" }
        warnings: { type: array, items: { type: string } }
    Preset:
      type: object
      required: [key, name, summary]
      properties:
        key: { type: string }
        name: { type: string }
        summary: { type: string }
    TuningChange:
      type: object
      required: [path, value, why, reason, now]
      properties:
        path: { type: array, items: { type: string }, description: "One key per level: [routing, implement.S, model]" }
        value: { $ref: "#/components/schemas/SettingValue" }
        why: { type: string, description: The numbers the change rests on }
        reason: { type: string, description: "Why the daemon dropped it; empty on a kept change" }
        now: { type: string, description: "Why a kept change wouldn't apply to factory.yaml as it is now (it already says that, say); empty when it would" }
    TuningProposal:
      type: object
      required: [id, status, created_at, period_from, period_to, summary, changes, dropped, ideas, diff, pr_url]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, applied, dismissed, superseded] }
        created_at: { type: string }
        period_from: { type: string, description: The start of the period whose metrics it read }
        period_to: { type: string }
        summary: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/TuningChange" }, description: "Settings it would change, each on the dashboard's list and leaving a valid file" }
        dropped: { type: array, items: { $ref: "#/components/schemas/TuningChange" }, description: Changes the daemon refused, with the reason }
        ideas: { type: array, items: { type: string }, description: "Prompt and skill changes, in prose, for you to make" }
        diff: { type: string, description: "The unified diff the changes would make to factory.yaml as it is now" }
        pr_url: { type: string, description: "The draft PR it opened, when tuning.repo is set; empty otherwise" }
    Tuning:
      type: object
      required: [proposal]
      properties:
        proposal:
          oneOf: [{ $ref: "#/components/schemas/TuningProposal" }, { type: "null" }]
    Wizard:
      type: object
      required: [mode, writable, reason, config_path, env_path, steps, machine, machine_checked_at, repos, access, checks, labels, label_names, github, gitlab, claude, codex, notify, sentry, images, can_finish, warnings, changed, restart_pending, restart_waits_for, setup_reason, started_at]
      properties:
        mode: { type: string, enum: [setup, normal], description: "setup while the dashboard serves only this page, until Finish starts the factory" }
        writable: { type: boolean, description: This request may save here }
        reason: { type: string, description: "Why not, when it can't" }
        config_path: { type: string }
        env_path: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/WizardStep" }, description: The cards in order }
        machine: { type: array, items: { $ref: "#/components/schemas/WizardFinding" } }
        machine_checked_at: { type: string, description: "Empty while the first check runs" }
        repos: { type: array, items: { type: string } }
        access: { type: array, items: { $ref: "#/components/schemas/WizardAccess" }, description: Each repo's last access check }
        checks: { type: array, items: { $ref: "#/components/schemas/WizardChecks" }, description: "Each repo's checks, saved or suggested" }
        labels: { type: array, items: { $ref: "#/components/schemas/WizardLabel" }, description: What the last label creation did }
        label_names: { type: array, items: { type: string } }
        github: { oneOf: [{ $ref: "#/components/schemas/WizardGitHub" }, { type: "null" }], description: Null without GitHub repos }
        gitlab: { oneOf: [{ $ref: "#/components/schemas/WizardGitLab" }, { type: "null" }], description: Null without GitLab repos }
        claude: { oneOf: [{ $ref: "#/components/schemas/WizardClaude" }, { type: "null" }], description: Null when no job runs on Claude }
        codex: { oneOf: [{ $ref: "#/components/schemas/WizardCodex" }, { type: "null" }], description: Null when no job runs on Codex }
        notify: { $ref: "#/components/schemas/WizardSecret" }
        sentry: { oneOf: [{ $ref: "#/components/schemas/WizardSecret" }, { type: "null" }], description: Null unless sources.sentry is on }
        images: { oneOf: [{ $ref: "#/components/schemas/WizardImages" }, { type: "null" }], description: Null unless jobs run in Docker }
        can_finish: { type: boolean, description: The factory can reach every repo }
        warnings: { type: array, items: { type: string }, description: "What won't work yet if you finish now" }
        changed: { type: boolean, description: factory.yaml or factory.env changed since the factory started }
        restart_pending: { type: boolean }
        restart_waits_for: { type: string, description: "Other work the pending restart waits for; else empty" }
        setup_reason: { type: string, description: "Why the factory can't start, in setup mode; else empty" }
        started_at: { type: string, description: "When this process started, so a page waiting on a restart can tell the new one from the old" }
    WizardStep:
      type: object
      required: [key, title, state, summary]
      properties:
        key: { type: string, enum: [machine, repos, github, gitlab, checks, claude, codex, notify, sentry, images, finish] }
        title: { type: string }
        state: { type: string, enum: [done, attention, optional] }
        summary: { type: string }
    WizardChecks:
      type: object
      required: [repo, stack, saved, image_from, image_build, install, suggested_install, gates, notes, services, env, try]
      properties:
        repo: { type: string }
        stack: { type: string, description: "What the repo looks like, such as Ruby on Rails; empty until the access check has read its files" }
        saved: { type: boolean, description: factory.yaml has the repo's own checks }
        image_from: { type: string, description: "The base image its job image is built on; empty for the default" }
        image_build:
          description: The repo's own Dockerfile its job image is built from instead, or null
          oneOf:
            - $ref: "#/components/schemas/ImageBuild"
            - type: "null"
        install: { type: string }
        suggested_install: { type: string, description: "The suggested install when it differs" }
        gates: { type: array, items: { $ref: "#/components/schemas/WizardGate" } }
        notes: { type: array, items: { type: string } }
        services: { type: array, items: { $ref: "#/components/schemas/WizardService" }, description: "The containers its checks start: saved, else suggested" }
        env: { type: object, additionalProperties: { type: string }, description: "The variables that find them, such as DATABASE_URL" }
        try:
          description: The last Try these checks, or null
          oneOf:
            - $ref: "#/components/schemas/WizardTry"
            - type: "null"
    SetupFix:
      type: object
      required: [repo, problem, line, changes, before, after, notes, version, writable, reason]
      properties:
        repo: { type: string }
        problem: { type: string, description: What the job's sandbox lacks, in a sentence }
        line: { type: string, description: The output line that showed it }
        changes: { type: array, items: { type: string }, description: "Each change, for people; empty when the repo's files suggest none" }
        before: { type: string, description: "The repo's entry in factory.yaml now" }
        after: { type: string, description: With the changes }
        notes: { type: array, items: { type: string } }
        version: { type: string, description: "factory.yaml's version as read; applying sends it back" }
        writable: { type: boolean }
        reason: { type: string, description: "Why it can't be applied here, when it can't" }
    ImageBuild:
      type: object
      required: [dockerfile, target, context, args, secrets]
      properties:
        dockerfile: { type: string, description: "Its path in the repo; empty for Dockerfile" }
        target: { type: string, description: "The stage to build; empty for the last" }
        context: { type: string, description: "The build context's path in the repo; empty for its root" }
        args:
          description: Its --build-arg values, or null
          oneOf: [{ type: object, additionalProperties: { type: string } }, { type: "null" }]
        secrets:
          description: Its build secrets by id, each a file on this machine (a path in files.from's checkout, or absolute), or null
          oneOf: [{ type: object, additionalProperties: { type: string } }, { type: "null" }]
    WizardService:
      type: object
      required: [name, image, saved]
      properties:
        name: { type: string }
        image: { type: string }
        saved: { type: boolean, description: "factory.yaml has it; else suggested from the repo's files" }
    WizardTry:
      type: object
      required: [running, since, steps, error]
      properties:
        running: { type: boolean }
        since: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/WizardTryStep" } }
        error: { type: string, description: "Why it couldn't run them, such as a clone or a service; else empty" }
    WizardTryStep:
      type: object
      required: [gate, command, state, seconds, output]
      properties:
        gate: { type: string }
        command: { type: string }
        state: { type: string, enum: [waiting, running, pass, fail, skipped] }
        seconds: { type: integer }
        output: { type: string, description: "The end of what it printed" }
    WizardGate:
      type: object
      required: [gate, command, suggested, source]
      properties:
        gate: { type: string }
        command: { type: string, description: "The saved command, else the suggested one" }
        suggested: { type: string, description: "The suggestion when it differs from command" }
        source: { type: string, description: "The file the suggestion came from, such as AGENTS.md; empty when guessed from the repo's files" }
    WizardFinding:
      type: object
      required: [status, what, fix, action]
      properties:
        status: { type: string, enum: [pass, warn, fail] }
        what: { type: string }
        fix: { type: string, description: "A command to run or a doc to read; may be several lines. Empty when action fixes it" }
        action: { type: string, enum: ["", build_images], description: "A button on the page that fixes it: build_images posts /setup/images/build" }
    WizardSecret:
      type: object
      required: [set, masked]
      properties:
        set: { type: boolean }
        masked: { type: string, description: "The first and last few characters, or just \"value\" for a short one; empty when unset" }
    WizardAccess:
      type: object
      required: [repo, host, state, error, hints, base_branch, default_branch, can_use_default, missing_labels, labels_error]
      properties:
        repo: { type: string }
        host: { type: string, enum: [github, gitlab] }
        state: { type: string, enum: [unchecked, ok, failed] }
        error: { type: string }
        hints: { type: array, items: { type: string } }
        base_branch: { type: string, description: The branch factory.yaml uses }
        default_branch: { type: string, description: "The repo's default branch when it differs, else empty" }
        can_use_default: { type: boolean, description: "One repo, so its base_branch can be set here" }
        missing_labels: { type: array, items: { type: string }, description: "The factory's labels the repo lacks, from the last check" }
        labels_error: { type: string, description: "Why its labels couldn't be listed" }
    WizardLabel:
      type: object
      required: [repo, name, result, error]
      properties:
        repo: { type: string }
        name: { type: string }
        result: { type: string, enum: [created, exists, failed] }
        error: { type: string }
    WizardOwner:
      type: object
      required: [owner, repos]
      properties:
        owner: { type: string }
        repos: { type: array, items: { type: string } }
    WizardGitHub:
      type: object
      required: [method, app_id, app_slug, key_path, installation_id, install_url, missing, install_steps, install_error, token, token_url, app_owner]
      properties:
        method: { type: string, enum: [app, token, none] }
        app_id: { type: string }
        app_slug: { type: string }
        key_path: { type: string }
        installation_id: { type: string }
        install_url: { type: string, description: "Installs the app; empty when its slug isn't known" }
        missing: { type: array, items: { $ref: "#/components/schemas/WizardOwner" }, description: "Accounts the app isn't installed on, from the last check" }
        install_steps: { type: array, items: { type: string } }
        install_error: { type: string }
        token: { $ref: "#/components/schemas/WizardSecret" }
        token_url: { type: string, description: Where to make a personal access token }
        app_owner: { type: string, description: The account a new app belongs to }
    WizardGitLab:
      type: object
      required: [token, hosts, fine_grained]
      properties:
        token: { $ref: "#/components/schemas/WizardSecret" }
        hosts: { type: array, items: { $ref: "#/components/schemas/WizardHost" } }
        fine_grained: { type: array, items: { type: string }, description: The permissions a fine-grained token needs on each project }
    WizardHost:
      type: object
      required: [host, legacy_url, tokens_url]
      properties:
        host: { type: string }
        legacy_url: { type: string, description: "Opens the form for a legacy token with its scopes ticked" }
        tokens_url: { type: string, description: The page fine-grained tokens are made on }
    WizardClaude:
      type: object
      required: [kind, key, role]
      properties:
        kind: { type: string, enum: [api_key, subscription, ""] }
        key: { $ref: "#/components/schemas/WizardSecret" }
        role: { type: string, enum: [builds, reviews, builds and reviews, ""], description: "What Claude does; empty while it isn't connected" }
    WizardCodex:
      type: object
      required: [mode, api_key, access_token, signed_in, sign_in, role]
      properties:
        mode: { type: string, enum: [api-key, chatgpt, access-token] }
        api_key: { $ref: "#/components/schemas/WizardSecret" }
        access_token: { $ref: "#/components/schemas/WizardSecret" }
        signed_in: { type: boolean, description: The ChatGPT sign-in is saved }
        sign_in: { $ref: "#/components/schemas/WizardSignIn" }
        role: { type: string, enum: [builds, reviews, builds and reviews, ""], description: "What Codex does; empty while it isn't connected" }
    WizardSignIn:
      type: object
      description: A ChatGPT sign-in with a device code, started with /setup/codex/sign-in
      required: [running, url, code, log, result, failed]
      properties:
        running: { type: boolean }
        url: { type: string, description: "The link to open, once Codex shows it. Empty for a request that may not change settings" }
        code: { type: string, description: "The code to enter there; empty like url" }
        log: { type: string, description: "The end of Codex's output; empty like url" }
        result: { type: string, description: "How the last one ended; empty before one ran" }
        failed: { type: boolean }
    WizardImages:
      type: object
      required: [images, building, log, result, failed]
      properties:
        images: { type: array, items: { $ref: "#/components/schemas/WizardImage" } }
        building: { type: boolean }
        log: { type: string, description: "The end of the running or last build's output" }
        result: { type: string, description: "How the last build ended; empty before one ran" }
        failed: { type: boolean }
    WizardImage:
      type: object
      required: [tag, for, built]
      properties:
        tag: { type: string }
        for: { type: string, description: The repos (or other jobs) that run in it }
        built: { type: boolean }
    WizardManifest:
      type: object
      required: [url, state, manifest]
      properties:
        url: { type: string, description: "GitHub's new-app form, with the state" }
        state: { type: string }
        manifest: { type: string, description: JSON to post as the form field manifest }
    WizardResult:
      type: object
      required: [message, wizard]
      properties:
        message: { type: string }
        wizard: { $ref: "#/components/schemas/Wizard" }

      required: [path, writable, reason, version, changed, restart_pending, restart_waits_for, running_jobs, groups]
      properties:
        path: { type: string, description: The config file }
        writable: { type: boolean }
        reason: { type: string, description: "Why settings can't be changed here; empty when they can" }
        version: { type: string, description: Changes whenever the file does }
        changed: { type: boolean, description: The file differs from the one the factory started with }
        restart_pending: { type: boolean }
        restart_waits_for: { type: string, description: "Other work the pending restart waits for, such as \"the job image build\" or \"the Codex sign-in\"; else empty" }
        running_jobs: { type: integer }
        groups: { type: array, items: { $ref: "#/components/schemas/SettingsGroup" } }
    TuningChange:
      type: object
      required: [path, value, why, reason, now]
      properties:
        path: { type: array, items: { type: string }, description: "One key per level: [routing, implement.S, model]" }
        value: { $ref: "#/components/schemas/SettingValue" }
        why: { type: string, description: The numbers the change rests on }
        reason: { type: string, description: "Why the daemon dropped it; empty on a kept change" }
        now: { type: string, description: "Why a kept change wouldn't apply to factory.yaml as it is now (it already says that, say); empty when it would" }
    TuningProposal:
      type: object
      required: [id, status, created_at, period_from, period_to, summary, changes, dropped, ideas, diff, pr_url]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, applied, dismissed, superseded] }
        created_at: { type: string }
        period_from: { type: string, description: The start of the period whose metrics it read }
        period_to: { type: string }
        summary: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/TuningChange" }, description: "Settings it would change, each on the dashboard's list and leaving a valid file" }
        dropped: { type: array, items: { $ref: "#/components/schemas/TuningChange" }, description: Changes the daemon refused, with the reason }
        ideas: { type: array, items: { type: string }, description: "Prompt and skill changes, in prose, for you to make" }
        diff: { type: string, description: "The unified diff the changes would make to factory.yaml as it is now" }
        pr_url: { type: string, description: "The draft PR it opened, when tuning.repo is set; empty otherwise" }
    Tuning:
      type: object
      required: [proposal]
      properties:
        proposal:
          oneOf: [{ $ref: "#/components/schemas/TuningProposal" }, { type: "null" }]
    Wizard:
      type: object
      required: [mode, writable, reason, config_path, env_path, steps, machine, machine_checked_at, repos, access, checks, labels, label_names, github, gitlab, claude, codex, notify, sentry, images, can_finish, warnings, changed, restart_pending, restart_waits_for, setup_reason, started_at]
      properties:
        mode: { type: string, enum: [setup, normal], description: "setup while the dashboard serves only this page, until Finish starts the factory" }
        writable: { type: boolean, description: This request may save here }
        reason: { type: string, description: "Why not, when it can't" }
        config_path: { type: string }
        env_path: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/WizardStep" }, description: The cards in order }
        machine: { type: array, items: { $ref: "#/components/schemas/WizardFinding" } }
        machine_checked_at: { type: string, description: "Empty while the first check runs" }
        repos: { type: array, items: { type: string } }
        access: { type: array, items: { $ref: "#/components/schemas/WizardAccess" }, description: Each repo's last access check }
        checks: { type: array, items: { $ref: "#/components/schemas/WizardChecks" }, description: "Each repo's checks, saved or suggested" }
        labels: { type: array, items: { $ref: "#/components/schemas/WizardLabel" }, description: What the last label creation did }
        label_names: { type: array, items: { type: string } }
        github: { oneOf: [{ $ref: "#/components/schemas/WizardGitHub" }, { type: "null" }], description: Null without GitHub repos }
        gitlab: { oneOf: [{ $ref: "#/components/schemas/WizardGitLab" }, { type: "null" }], description: Null without GitLab repos }
        claude: { oneOf: [{ $ref: "#/components/schemas/WizardClaude" }, { type: "null" }], description: Null when no job runs on Claude }
        codex: { oneOf: [{ $ref: "#/components/schemas/WizardCodex" }, { type: "null" }], description: Null when no job runs on Codex }
        notify: { $ref: "#/components/schemas/WizardSecret" }
        sentry: { oneOf: [{ $ref: "#/components/schemas/WizardSecret" }, { type: "null" }], description: Null unless sources.sentry is on }
        images: { oneOf: [{ $ref: "#/components/schemas/WizardImages" }, { type: "null" }], description: Null unless jobs run in Docker }
        can_finish: { type: boolean, description: The factory can reach every repo }
        warnings: { type: array, items: { type: string }, description: "What won't work yet if you finish now" }
        changed: { type: boolean, description: factory.yaml or factory.env changed since the factory started }
        restart_pending: { type: boolean }
        restart_waits_for: { type: string, description: "Other work the pending restart waits for; else empty" }
        setup_reason: { type: string, description: "Why the factory can't start, in setup mode; else empty" }
        started_at: { type: string, description: "When this process started, so a page waiting on a restart can tell the new one from the old" }
    WizardStep:
      type: object
      required: [key, title, state, summary]
      properties:
        key: { type: string, enum: [machine, repos, github, gitlab, checks, claude, codex, notify, sentry, images, finish] }
        title: { type: string }
        state: { type: string, enum: [done, attention, optional] }
        summary: { type: string }
    WizardChecks:
      type: object
      required: [repo, stack, saved, image_from, install, suggested_install, gates, notes]
      properties:
        repo: { type: string }
        stack: { type: string, description: "What the repo looks like, such as Ruby on Rails; empty until the access check has read its files" }
        saved: { type: boolean, description: factory.yaml has the repo's own checks }
        image_from: { type: string, description: "The base image its job image is built on; empty for the default" }
        install: { type: string }
        suggested_install: { type: string, description: "The suggested install when it differs" }
        gates: { type: array, items: { $ref: "#/components/schemas/WizardGate" } }
        notes: { type: array, items: { type: string } }
    WizardGate:
      type: object
      required: [gate, command, suggested, source]
      properties:
        gate: { type: string }
        command: { type: string, description: "The saved command, else the suggested one" }
        suggested: { type: string, description: "The suggestion when it differs from command" }
        source: { type: string, description: "The file the suggestion came from, such as AGENTS.md; empty when guessed from the repo's files" }
    WizardFinding:
      type: object
      required: [status, what, fix, action]
      properties:
        status: { type: string, enum: [pass, warn, fail] }
        what: { type: string }
        fix: { type: string, description: "A command to run or a doc to read; may be several lines. Empty when action fixes it" }
        action: { type: string, enum: ["", build_images], description: "A button on the page that fixes it: build_images posts /setup/images/build" }
    WizardSecret:
      type: object
      required: [set, masked]
      properties:
        set: { type: boolean }
        masked: { type: string, description: "The first and last few characters, or just \"value\" for a short one; empty when unset" }
    WizardAccess:
      type: object
      required: [repo, host, state, error, hints, base_branch, default_branch, can_use_default, missing_labels, labels_error]
      properties:
        repo: { type: string }
        host: { type: string, enum: [github, gitlab] }
        state: { type: string, enum: [unchecked, ok, failed] }
        error: { type: string }
        hints: { type: array, items: { type: string } }
        base_branch: { type: string, description: The branch factory.yaml uses }
        default_branch: { type: string, description: "The repo's default branch when it differs, else empty" }
        can_use_default: { type: boolean, description: "One repo, so its base_branch can be set here" }
        missing_labels: { type: array, items: { type: string }, description: "The factory's labels the repo lacks, from the last check" }
        labels_error: { type: string, description: "Why its labels couldn't be listed" }
    WizardLabel:
      type: object
      required: [repo, name, result, error]
      properties:
        repo: { type: string }
        name: { type: string }
        result: { type: string, enum: [created, exists, failed] }
        error: { type: string }
    WizardOwner:
      type: object
      required: [owner, repos]
      properties:
        owner: { type: string }
        repos: { type: array, items: { type: string } }
    WizardGitHub:
      type: object
      required: [method, app_id, app_slug, key_path, installation_id, install_url, missing, install_steps, install_error, token, token_url, app_owner]
      properties:
        method: { type: string, enum: [app, token, none] }
        app_id: { type: string }
        app_slug: { type: string }
        key_path: { type: string }
        installation_id: { type: string }
        install_url: { type: string, description: "Installs the app; empty when its slug isn't known" }
        missing: { type: array, items: { $ref: "#/components/schemas/WizardOwner" }, description: "Accounts the app isn't installed on, from the last check" }
        install_steps: { type: array, items: { type: string } }
        install_error: { type: string }
        token: { $ref: "#/components/schemas/WizardSecret" }
        token_url: { type: string, description: Where to make a personal access token }
        app_owner: { type: string, description: The account a new app belongs to }
    WizardGitLab:
      type: object
      required: [token, hosts, fine_grained]
      properties:
        token: { $ref: "#/components/schemas/WizardSecret" }
        hosts: { type: array, items: { $ref: "#/components/schemas/WizardHost" } }
        fine_grained: { type: array, items: { type: string }, description: The permissions a fine-grained token needs on each project }
    WizardHost:
      type: object
      required: [host, legacy_url, tokens_url]
      properties:
        host: { type: string }
        legacy_url: { type: string, description: "Opens the form for a legacy token with its scopes ticked" }
        tokens_url: { type: string, description: The page fine-grained tokens are made on }
    WizardClaude:
      type: object
      required: [kind, key]
      properties:
        kind: { type: string, enum: [api_key, subscription, ""] }
        key: { $ref: "#/components/schemas/WizardSecret" }
    WizardCodex:
      type: object
      required: [mode, api_key, access_token, signed_in, sign_in, review_only]
      properties:
        mode: { type: string, enum: [api-key, chatgpt, access-token] }
        api_key: { $ref: "#/components/schemas/WizardSecret" }
        access_token: { $ref: "#/components/schemas/WizardSecret" }
        signed_in: { type: boolean, description: The ChatGPT sign-in is saved }
        sign_in: { $ref: "#/components/schemas/WizardSignIn" }
        review_only: { type: boolean, description: Claude writes the code and Codex reviews it }
    WizardSignIn:
      type: object
      description: A ChatGPT sign-in with a device code, started with /setup/codex/sign-in
      required: [running, url, code, log, result, failed]
      properties:
        running: { type: boolean }
        url: { type: string, description: "The link to open, once Codex shows it. Empty for a request that may not change settings" }
        code: { type: string, description: "The code to enter there; empty like url" }
        log: { type: string, description: "The end of Codex's output; empty like url" }
        result: { type: string, description: "How the last one ended; empty before one ran" }
        failed: { type: boolean }
    WizardImages:
      type: object
      required: [images, building, log, result, failed]
      properties:
        images: { type: array, items: { $ref: "#/components/schemas/WizardImage" } }
        building: { type: boolean }
        log: { type: string, description: "The end of the running or last build's output" }
        result: { type: string, description: "How the last build ended; empty before one ran" }
        failed: { type: boolean }
    WizardImage:
      type: object
      required: [tag, for, built]
      properties:
        tag: { type: string }
        for: { type: string, description: The repos (or other jobs) that run in it }
        built: { type: boolean }
    WizardManifest:
      type: object
      required: [url, state, manifest]
      properties:
        url: { type: string, description: "GitHub's new-app form, with the state" }
        state: { type: string }
        manifest: { type: string, description: JSON to post as the form field manifest }
    WizardResult:
      type: object
      required: [message, wizard]
      properties:
        message: { type: string }
        wizard: { $ref: "#/components/schemas/Wizard" }

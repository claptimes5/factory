      type: object
      required: [labels, repos, kept, images, images_note, data, manual, refused, writable, reason]
      properties:
        kept: { type: array, items: { $ref: "#/components/schemas/UninstallKept" }, description: "What looks like the factory's but stays, with why: a GitLab group's label, an intake label you made, a runner image not marked as the factory's" }

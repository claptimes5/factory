openapi: 3.1.0
info:
  title: Factory control room API
  version: "1"
  description: |
    The JSON API behind the dashboard at /app/, served beside the control
    room. When the control room has a password, requests without a session
    get 401 and the dashboard sends you to /login. POST requests must be application/json and
    same-origin. Every property is always present; nullable ones are null
    when unset.
servers:
  - url: /api/v1
paths:
  /overview:
    get:
      summary: Header strip shown on every screen
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Overview" } } } }
  /board:
    get:
      summary: Work items in columns by stage
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
  /items/{id}:
    get:
      summary: One item with its jobs, events, dependencies, issue text and spec
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/pr:
    get:
      summary: CI checks, gate results and the reviewer verdict for the item's PR
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PRPanel" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/diff:
    get:
      summary: The patch the latest reviewer saw, with its findings
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Diff" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/preview:
    get:
      summary: The screenshots of the item's newest build that took any
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/preview/{file}:
    get:
      summary: One screenshot, as a PNG
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: file, in: path, required: true, schema: { type: string } }
        - { name: job, in: query, description: "The build whose screenshot this is, as the shot's url names it", schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The image, content: { image/png: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/park:
    post:
      summary: Park an item with a question for the human
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /items/{id}/approve-estimate:
    post:
      summary: Approve an item whose cost estimate or plan waits for a human's OK
      description: One OK covers both when both wait, as factory:go does. Needs the password, or a request from this machine (403 otherwise), as settings do.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_job_id: { type: integer, description: "The plan job the page shows (Plan.job_id), when it shows one: a plan that changed since is refused (409) rather than approved unread" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /items/{id}/replan:
    post:
      summary: Ask for another plan, saying what to change, for an item whose plan waits for a human's OK
      description: What a comment and factory:replan on the issue do; the ask goes on the issue too. A plan that was already asked again parks the item. Needs the password, or a request from this machine (403 otherwise), as settings do.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_job_id, ask]
              properties:
                plan_job_id: { type: integer, description: "The plan job the page shows (Plan.job_id): a plan that changed since is refused (409)" }
                ask: { type: string, description: What to change about the plan }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /auto-merge/reset:
    post:
      summary: Reset a repo's tripped auto-merge breaker, so its PRs may merge themselves again
      description: Needs the password, or a request from this machine (403 otherwise), as settings do. PRs whose auto-merge the breaker cancelled still wait for you.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties: { repo: { type: string, description: "owner/name" } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /usage:
    get:
      summary: How much of each subscription plan's usage windows the factory's harnesses have used
      description: Only harnesses in use that run on a plan (Claude with a subscription token, Codex on a ChatGPT plan). On a plan, dollar figures are what the work would cost at API prices; the windows are what limit it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanUsage" } } } }
  /readiness:
    get:
      summary: How ready each repo is for the factory, from the readiness check's latest report
      description: Each blocker and gap comes with the issue filed for it and the factory's item for that issue.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
  /readiness/check:
    post:
      summary: Run the readiness check on a repo again, in the background
      description: |
        Clones the repo's base branch and runs its install and checks, as a
        build's gates do, then saves the report. It files and labels nothing.
        One check runs at a time (409 while one does). Needs the password, or
        a request from this machine, and a daemon that can run it (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties: { repo: { type: string, description: "owner/name" } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /chats:
    get:
      summary: The chat with the orchestrator's model, whether it can reply now, and the chats so far
      description: Chat runs on the orchestrator's route and its daily budget, whether or not the orchestrator runs on its own schedule.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Chats" } } } }
    post:
      summary: Send a message and start the reply
      description: |
        chat_id 0 starts a new chat. An empty text asks again for a reply to the
        chat's last message, when it has none (after a failed reply). The reply
        is written by a read-only run that may draft issues; it is never an
        issue until a person creates the draft. One reply is written at a time
        (409 while one is, or when chat can't reply now, with why).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id: { type: integer, format: int64 }
                text: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SentChat" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /chats/{id}:
    get:
      summary: One chat, with its messages, the issues it drafted, and the reply being written
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Chat" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /drafts/{id}/create:
    post:
      summary: Open a drafted issue for the factory to build, approved by the person creating it
      description: A title or body given replaces the draft's. 410 when the draft was already created or dismissed; 409 when the forge refused it, with why.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /drafts/{id}/dismiss:
    post:
      summary: Set a drafted issue aside without opening it
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /jobs/{id}:
    get:
      summary: One job with its gate results
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JobDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/log:
    get:
      summary: The job's transcript as server-sent events
      description: |
        One `line` event per log line, with data `{"text": string, "entries": [TranscriptEntry]}`:
        the line in short, and its pieces (none for bookkeeping lines). Then one `done` event
        with data `{"state": string}` once the job ends.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
  /jobs/{id}/log.jsonl:
    get:
      summary: The job's whole log as its CLI wrote it, secrets taken out, to download
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: JSON lines, content: { text/plain: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/saved-diff:
    get:
      summary: A stopped build's work against the base branch, kept on this machine
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Diff" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/continue:
    post:
      summary: Continue a build that ran out of turns or budget, in the checkout and session it kept
      description: |
        `extra` adds turns and budget as a fraction of the usual (0.5 is half as much again,
        at most 2). Adding any needs the password, or a request from this machine (403
        otherwise), as settings do. `note` goes to the builder first.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                extra: { type: number, minimum: 0, maximum: 2 }
                note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /jobs/{id}/steer:
    post:
      summary: Send a running build a message, which it reads at its next step
      description: Claude builds only; Codex reads its whole prompt when it starts.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /jobs/{id}/terminal:
    get:
      summary: A live shell in the running job's container, over WebSocket
      description: |
        Output arrives as binary frames. Send text frames holding
        `{"type":"input","data":string}` for keystrokes and
        `{"type":"resize","cols":int,"rows":int}` when the window changes.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "101": { description: Switching protocols }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /jobs/{id}/retry:
    post:
      summary: Queue the job again, optionally one model tier up
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { tier_up: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /jobs/{id}/cancel:
    post:
      summary: Cancel a queued or running job
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /activity:
    get:
      summary: What happened lately, said for people, newest first
      parameters:
        - name: repo
          in: query
          required: false
          schema: { type: string }
          description: Only this repo's items (owner/name), plus lines about no item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
  /orchestrator:
    get:
      summary: The orchestrator's decisions, newest first
      parameters:
        - { name: item, in: query, required: false, schema: { type: integer }, description: Only this item's decisions }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Feed" } } } }
  /metrics:
    get:
      summary: Cost per merged PR, first-pass and escalation rates, overall and per week
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Metrics" } } } }
  /spend:
    get:
      summary: Spend by day (30 days, newest first) and by model
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Spend" } } } }
  /notifications:
    get:
      summary: Things the human may need to act on
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Notifications" } } } }
  /stream:
    get:
      summary: 'A `version` event (data `{"version": string}`) whenever anything shown changes'
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
  /settings:
    get:
      summary: The settings the dashboard may change, with factory.yaml's values
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Change settings in factory.yaml, keeping its comments
      description: |
        Only paths the GET lists are accepted. A null value removes the key,
        so the default applies. The whole file must still load, or nothing
        is written and the error says why. Changes apply when the factory
        restarts.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [changes, version]
              properties:
                changes:
                  type: array
                  items:
                    type: object
                    required: [path, value]
                    properties:
                      path: { type: array, items: { type: string } }
                      value: { $ref: "#/components/schemas/SettingValue" }
                version: { type: string, description: "The version the GET returned; a save over a file changed since is refused (409)" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/restart:
    post:
      summary: Restart the factory once running jobs finish, to apply saved settings
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /settings/restart/cancel:
    post:
      summary: Call off a restart that is still waiting for jobs
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /settings/tuning:
    get:
      summary: The tuning loop's proposal waiting for you, if any
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tuning" } } } }
  /settings/tuning/{id}/apply:
    post:
      summary: Apply a tuning proposal to factory.yaml
      description: |
        Re-applies the proposal's changes to the file as it is now, through
        the same checks as a save, so edits made since are kept. Changes
        apply when the factory restarts.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: "The version the settings GET returned; a file changed since is refused (409)" }
                changes: { type: array, items: { type: integer }, description: "Indexes of the changes to apply; all of them when left out" }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/tuning/{id}/dismiss:
    post:
      summary: Dismiss a tuning proposal without changing factory.yaml
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Action:
      description: Whether the daemon accepted the action, and why not
      content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    ActionResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    Overview:
      type: object
      required: [repo, repos, spent_today_usd, daily_cap_usd, awaiting, awaiting_cap, running, queued, version, disk_low, signed_in, main_health, auto_merge]
      properties:
        auto_merge:
          type: array
          description: Each repo's auto-merge breaker, where auto-merge is on or its breaker tripped
          items: { $ref: "#/components/schemas/Breaker" }
        main_health:
          type: array
          description: Each repo's base branch CI, as main health last read it; empty while it's off
          items: { $ref: "#/components/schemas/MainHealth" }
        disk_low: { type: string, description: "Why no job is starting for lack of disk; empty when there's room" }
        signed_in: { type: boolean, description: "The control room asks for a password (so the app can sign out)" }
        repo: { type: string, description: "the first repo; see repos" }
        repos: { type: array, items: { type: string }, description: "every repo the factory works on, as owner/name" }
        spent_today_usd: { type: number }
        daily_cap_usd: { type: number }
        awaiting: { type: integer }
        awaiting_cap: { type: integer }
        running: { type: integer }
        queued: { type: integer }
        version: { type: string }
    Breaker:
      type: object
      required: [repo, on, tripped, tripped_at, reason, strikes, threshold, window_hours, cool_off_hours, can_reset]
      properties:
        repo: { type: string }
        on: { type: boolean, description: "auto_merge lets the repo's PRs merge themselves" }
        tripped: { type: boolean, description: "The breaker turned auto-merge off until it's reset" }
        tripped_at: { type: string, description: "When it tripped; empty while it hasn't" }
        reason: { type: string, description: "The strikes that tripped it" }
        strikes: { type: integer, description: "Reverted or main-breaking factory PRs in the window since the last reset" }
        threshold: { type: integer, description: "Strikes that trip it; 0 when it never trips" }
        window_hours: { type: integer }
        cool_off_hours: { type: integer, description: "0 when only a human resets it" }
        can_reset: { type: boolean, description: "This request may reset it (tripped, and behind the password or on this machine)" }
    Chats:
      type: object
      required: [available, unavailable, model, harness, plan, orchestrator_on, orchestrator_every, run_budget_usd, daily_budget_usd, spent_today_usd, chats]
      properties:
        available: { type: boolean, description: A message sent now gets a reply }
        unavailable: { type: string, description: "Why chat can't reply now; empty when it can" }
        model: { type: string, description: "The orchestrator's model, which chat runs on" }
        harness: { type: string }
        plan: { type: boolean, description: The harness runs on a subscription plan, so dollars are what the work would cost at API prices }
        orchestrator_on: { type: boolean, description: The orchestrator also runs on its own schedule }
        orchestrator_every: { type: string, description: "How often it runs on its own, such as 1h0m0s" }
        run_budget_usd: { type: number, description: Dollars per orchestrator run or chat reply }
        daily_budget_usd: { type: number, description: Dollars per day across the orchestrator, tuning and chat }
        spent_today_usd: { type: number }
        chats: { type: array, items: { $ref: "#/components/schemas/ChatAt" }, description: The most recent first }
    ChatAt:
      type: object
      required: [id, title, updated_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        updated_at: { type: string }
    Chat:
      type: object
      required: [id, title, messages, drafts, reply]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        drafts: { type: array, items: { $ref: "#/components/schemas/Draft" } }
        reply:
          description: The run answering the last message, while it runs or when it failed; null once it answered
          oneOf: [{ $ref: "#/components/schemas/ChatReply" }, { type: "null" }]
    ChatMessage:
      type: object
      required: [id, role, text, at, job_id]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [user, assistant] }
        text: { type: string, description: Markdown }
        at: { type: string }
        job_id: { type: [integer, "null"], format: int64, description: The run that wrote a reply }
    ChatReply:
      type: object
      required: [job_id, state, error]
      properties:
        job_id: { type: integer, format: int64 }
        state: { type: string, description: "queued, running, failed, timed_out or cancelled" }
        error: { type: string }
    SentChat:
      type: object
      required: [chat_id, job_id]
      properties:
        chat_id: { type: integer, format: int64 }
        job_id: { type: integer, format: int64 }
    Draft:
      type: object
      required: [id, repo, title, body, labels, depends_on, parent, state, issue_number, issue_url, item_id, error, updated_at]
      properties:
        id: { type: integer, format: int64 }
        repo: { type: string }
        title: { type: string }
        body: { type: string, description: Markdown }
        labels: { type: array, items: { type: string }, description: Labels besides the intake label, which it gets when created }
        depends_on: { type: array, items: { type: integer, format: int64 }, description: Items that must be done first }
        parent: { type: [integer, "null"], format: int64, description: The epic item it is part of }
        state: { type: string, enum: [draft, creating, created, dismissed] }
        issue_number: { type: [integer, "null"] }
        issue_url: { type: string, description: "The issue's page once created; else empty" }
        item_id: { type: [integer, "null"], format: int64 }
        error: { type: string, description: "Why creating it last failed; else empty" }
        updated_at: { type: string }
    PlanUsage:
      type: object
      required: [plans]
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/UsagePlan" } }
    UsagePlan:
      type: object
      required: [harness, name, plan, windows, no_reading, pause_at]
      properties:
        harness: { type: string, description: "claude or codex" }
        name: { type: string, description: "Claude, Codex" }
        plan: { type: string, description: "Claude subscription, ChatGPT plan" }
        windows:
          type: array
          description: Its latest readings, five-hour first, then weekly; empty until one arrives
          items: { $ref: "#/components/schemas/Usage" }
        no_reading: { type: string, description: "When a reading will come, while there is none; else empty" }
        pause_at: { type: number, description: "Percent of a five-hour or weekly window at which its jobs wait for the reset" }
    Readiness:
      type: object
      required: [repos, banner, intake_label, can_check, check_note]
      properties:
        repos: { type: array, items: { $ref: "#/components/schemas/RepoReadiness" } }
        banner:
          type: string
          enum: ["", not_ready, ready]
          description: "not_ready while a checked repo has blockers or its check couldn't finish; ready once every checked repo is ready and the factory has worked on nothing but their setup"
        intake_label: { type: string, description: The label that hands an issue to the factory }
        can_check: { type: boolean, description: "This request may run the check here (behind the password or on this machine, with a daemon that can)" }
        check_note: { type: string, description: "Why it can't, or empty" }
    RepoReadiness:
      type: object
      required: [repo, state, checked_at, branch, sha, score, done, total, steps, extras, unqueued, command, queue_command, checking, checking_since, check_error]
      properties:
        repo: { type: string }
        state: { type: string, enum: [unchecked, incomplete, not_ready, ready] }
        checked_at: { type: string, description: "When the latest report's check started; empty when unchecked" }
        branch: { type: string }
        sha: { type: string }
        score: { type: integer, description: 0 to 100 }
        done: { type: integer, description: Setup steps that pass }
        total: { type: integer, description: Setup steps in all }
        steps: { type: array, items: { $ref: "#/components/schemas/ReadinessStep" } }
        extras:
          type: array
          description: "Gaps and tips, worth doing but not needed to start, and what's in place beyond the steps"
          items: { $ref: "#/components/schemas/ReadinessFinding" }
        unqueued: { type: integer, description: Issues filed without the intake label }
        command: { type: string, description: Runs the check in a terminal }
        queue_command: { type: string, description: "Files and labels what still needs it; empty when nothing does" }
        checking: { type: boolean, description: A check started from the dashboard is running }
        checking_since: { type: string }
        check_error: { type: string, description: "Why the last check started here failed, or empty" }
    ReadinessStep:
      type: object
      required: [key, title, why, state, passed, blockers]
      properties:
        key: { type: string, enum: [install, checks, tests] }
        title: { type: string }
        why: { type: string, description: What the factory needs it for }
        state: { type: string, enum: [done, failing, unchecked] }
        passed: { type: string, description: "What the check saw when it's done, or empty" }
        blockers: { type: array, items: { $ref: "#/components/schemas/ReadinessFinding" } }
    ReadinessFinding:
      type: object
      required: [level, area, title, detail, issue, issue_url, status, item_id, item_stage]
      properties:
        level: { type: string, enum: [blocker, gap, tip, good] }
        area: { type: string }
        title: { type: string, description: "Markdown: code spans in backticks" }
        detail: { type: string, description: "Markdown, with command output in fenced blocks" }
        issue: { type: integer, description: 0 when none is filed }
        issue_url: { type: string }
        status:
          type: string
          enum: [none, not_filed, not_queued, closed, waiting, building, needs_you, done]
          description: "The work on it: none when there's nothing to file (yours to fix, or in place)"
        item_id: { type: ["integer", "null"] }
        item_stage: { type: string }
    MainHealth:
      type: object
      required: [repo, branch, state, sha, detail, checks]
      properties:
        repo: { type: string }
        branch: { type: string }
        state: { type: string, enum: [green, red, flaky, pending, no_ci, unreadable] }
        sha: { type: string, description: the branch head it read }
        detail: { type: string, description: "the red, flaky or pending checks, or why CI can't be read" }
        checks:
          type: array
          description: The red and flaky checks it tracks, with the issue filed for each
          items:
            type: object
            required: [check, kind, issue, issue_url]
            properties:
              check: { type: string }
              kind: { type: string, enum: [red, flaky] }
              issue: { type: integer, description: 0 until filed (the day's cap was reached) }
              issue_url: { type: string }
    Item:
      type: object
      required: [id, repo, ref, issue, title, stage, complexity, risk, priority, parent_id, branch, pr_number, prs, created_at, updated_at, issue_url, pr_url, needs_you, blocked_note, estimate, estimate_waiting, plan_waiting, choice_job_id, choices]
      properties:
        id: { type: integer }
        repo: { type: string, description: "owner/name" }
        ref: { type: string, description: "how to show the issue: #12, or owner/name#12 when there are several repos" }
        issue: { type: integer }
        title: { type: string }
        stage: { $ref: "#/components/schemas/Stage" }
        complexity: { type: string, description: "XS, S, M, L, or empty before triage" }
        risk: { type: string }
        priority: { type: integer }
        parent_id: { type: [integer, "null"] }
        branch: { type: string }
        pr_number: { type: integer, description: 0 when there is no PR }
        prs:
          type: array
          description: A workspace change's PRs, one per repo it touches, in merge order; empty otherwise
          items: { $ref: "#/components/schemas/LinkedPR" }
        created_at: { type: string }
        updated_at: { type: string }
        issue_url: { type: string }
        pr_url: { type: string }
        needs_you: { type: boolean, description: Awaiting review, parked, or waiting for an OK on its cost }
        blocked_note: { type: string, description: Why it is parked or blocked }
        estimate: { type: string, description: "Triage's cost estimate in a line: $1.80–$3.10, on your plan, or empty" }
        estimate_waiting: { type: boolean, description: It waits for your OK on its cost estimate }
        plan_waiting: { type: boolean, description: It waits for your OK on its plan }
        choice_job_id: { type: [integer, "null"], description: "The job a parked item's choices act on; null unless it is parked" }
        choices:
          type: array
          description: What a person can do next with a parked item, each explained; empty unless it is parked
          items: { $ref: "#/components/schemas/Choice" }
    Choice:
      type: object
      required: [action, label, model, explain, available, why]
      properties:
        action: { type: string, enum: [continue, retry, tier_up, park] }
        label: { type: string }
        model: { type: string, description: "harness/model it would run on; empty for park" }
        explain: { type: string, description: What it does, in plain words }
        available: { type: boolean }
        why: { type: string, description: Why it isn't available }
    Stop:
      type: object
      description: How a build that ran out of turns or budget stopped
      required: [reason, summary, turns, max_turns, cost_usd, budget_usd, note, kept, saved_diff]
      properties:
        reason: { type: string, enum: [turns, budget] }
        summary: { type: string }
        turns: { type: integer }
        max_turns: { type: integer }
        cost_usd: { type: number }
        budget_usd: { type: number }
        note: { type: string, description: What the builder wrote down before it stopped }
        kept: { type: boolean, description: Its checkout is still there to continue in }
        saved_diff: { type: boolean, description: "Its work against the base branch can be read at /jobs/{id}/saved-diff" }
    TranscriptEntry:
      type: object
      description: One piece of a run's transcript, structured from its CLI's JSON log
      required: [kind, text, tool, tool_id, summary, input, output, truncated, is_error, model, tools, subtype, turns, cost_usd, delivered]
      properties:
        kind: { type: string, enum: [init, text, thinking, tool, tool_result, you, outcome, error] }
        text: { type: string, description: "The agent's words, its thinking, your message, an error, or (outcome) its final message" }
        tool: { type: string }
        tool_id: { type: string, description: A tool call's id; its result carries the same }
        summary: { type: string, description: "What a tool call did, in a line (Ran go test ./..., Read a.go), or how the run ended" }
        input: { type: string, description: "A tool call's whole input" }
        output: { type: string, description: "A tool result's output, cut at 20000 bytes" }
        truncated: { type: boolean }
        is_error: { type: boolean }
        model: { type: string }
        tools: { type: integer }
        subtype: { type: string, description: "outcome: the CLI's own word for how it ended (success, error_max_turns)" }
        turns: { type: integer }
        cost_usd: { type: number }
        delivered: { type: boolean, description: "you: false when the agent had already finished" }
    LinkedPR:
      type: object
      required: [repo, number, ref, url]
      properties:
        repo: { type: string }
        number: { type: integer }
        ref: { type: string, description: "How to show it: web#12" }
        url: { type: string }
    Stage:
      type: string
      enum: [epic, triage, spec, ready, implementing, reviewing, awaiting_human, parked, blocked, done]
    Card:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [model, cost_usd, live, live_job, live_kind, live_since, activity, attempt, gates_passed, gates_total]
          properties:
            model: { type: string }
            cost_usd: { type: number }
            live: { type: boolean }
            live_job: { type: [integer, "null"] }
            live_kind: { type: string, description: "The running job's kind (implement, review, ...), or empty" }
            live_since: { type: string, description: When the running job started }
            activity: { type: string, description: "What the running job is doing now, from its log: editing parser/parser.go" }
            attempt: { type: integer, description: The latest implement attempt, 0 before the first }
            gates_passed: { type: integer }
            gates_total: { type: integer, description: "Gates the latest implement attempt ran: 0 before any, if it never reached them, or once the item is done" }
    Column:
      type: object
      required: [stage, cards]
      properties:
        stage: { $ref: "#/components/schemas/Stage" }
        cards: { type: array, items: { $ref: "#/components/schemas/Card" } }
    Board:
      type: object
      required: [columns]
      properties:
        columns: { type: array, items: { $ref: "#/components/schemas/Column" } }
    Job:
      type: object
      required: [id, item_id, kind, state, harness, model, effort, attempt, cost_usd, budget_usd, tokens_in, tokens_out, verdict, error, queued_at, started_at, finished_at, branch, skillset, head_sha]
      properties:
        id: { type: integer }
        item_id: { type: [integer, "null"] }
        kind: { type: string, description: "triage, implement, review, critic, orchestrate" }
        state: { type: string, description: "queued, running, succeeded, failed, cancelled, interrupted, ..." }
        harness: { type: string }
        model: { type: string }
        effort: { type: string }
        attempt: { type: integer }
        cost_usd: { type: number }
        budget_usd: { type: number }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        verdict: { type: string, description: The stage's raw JSON verdict }
        error: { type: string }
        queued_at: { type: string }
        started_at: { type: string }
        finished_at: { type: string }
        branch: { type: string }
        skillset: { type: string }
        head_sha: { type: string }
    Gate:
      type: object
      required: [gate, status, detail]
      properties:
        gate: { type: string }
        status: { type: string, description: "pass, fail, misconfigured" }
        detail: { type: string }
    Event:
      type: object
      required: [id, at, actor, item_id, job_id, type, reason, data]
      properties:
        id: { type: integer }
        at: { type: string }
        actor: { type: string }
        item_id: { type: [integer, "null"] }
        job_id: { type: [integer, "null"] }
        type: { type: string }
        reason: { type: string }
        data: { type: string, description: JSON }
    ItemDetail:
      type: object
      required: [item, jobs, events, depends_on, issue_body, spec, estimate, plan, risk_reasons, needs_person]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        depends_on: { type: array, items: { type: integer } }
        issue_body: { type: string }
        spec: { type: string }
        risk_reasons:
          type: array
          description: 'Every reason the rating of the latest build''s diff found, with the level it rates the change at, whether or not it raised the item''s risk: "high: adds or changes a migration: `db/1.sql`"'
          items: { type: string }
        needs_person:
          type: array
          description: "Why the latest build waits for you whatever its risk (risk.needs_person); empty when nothing does"
          items: { type: string }
        estimate:
          oneOf:
            - $ref: "#/components/schemas/Estimate"
            - type: "null"
        plan:
          description: The plan of the item's current triage cycle; null when there is none or it isn't written yet
          oneOf:
            - $ref: "#/components/schemas/Plan"
            - type: "null"
    Plan:
      type: object
      required: [job_id, approach, files, risks, tests, waiting, approved_by, replan_of, can_approve]
      properties:
        job_id: { type: integer, description: The plan job }
        approach: { type: string }
        files: { type: array, items: { type: string }, description: The files it expects to touch }
        risks: { type: array, items: { type: string } }
        tests: { type: string }
        waiting: { type: boolean, description: It waits for your OK }
        approved_by: { type: string, description: "How it was approved (by @x, from the dashboard, by the critic), or empty" }
        replan_of: { type: string, description: "Who asked for this plan in place of an earlier one (@x, the critic), or empty for a first plan. The factory plans again only once, so asking for changes to this one parks the item" }
        can_approve: { type: boolean, description: "It waits, and this request may approve it or ask for another plan here (the password, or a request from this machine); else the factory:go and factory:replan labels it is" }
    Estimate:
      type: object
      required: [range, detail, status, size, median_usd, p75_usd, total_median_usd, total_p75_usd, threshold_usd, basis, samples, approved_by, created_at, actual_usd, finished, can_approve]
      properties:
        range: { type: string, description: "Median to p75 in a line: $1.80–$3.10, + plan usage, or on your plan" }
        detail: { type: string, description: "What it's based on: based on 14 past M items in o/api: median $1.80, p75 $3.10" }
        status: { type: string, enum: [off, under, exempt, waiting, parked, approved], description: "parked: parked while it waited, so it still needs an OK" }
        size: { type: string }
        median_usd: { type: number, description: Billed dollars }
        p75_usd: { type: number, description: Billed dollars; compared with threshold_usd }
        total_median_usd: { type: number, description: All the work, plan runs at the cost they report }
        total_p75_usd: { type: number }
        threshold_usd: { type: number, description: "confirm_over for its repo; 0 is off" }
        basis: { type: string, enum: [repo, all, default] }
        samples: { type: integer }
        approved_by: { type: string }
        created_at: { type: string }
        actual_usd: { type: number, description: "What building it has cost so far in this estimate's cycle (since its triage), triage left out" }
        finished: { type: boolean, description: The build is over, so actual_usd can be compared }
        can_approve: { type: boolean, description: "It waits, and this request may approve it here (the password, or a request from this machine); else the factory:go label it is" }
    Estimates:
      type: object
      required: [compared, within, median_miss_usd]
      properties:
        compared: { type: integer, description: Finished builds with an estimate }
        within: { type: integer, description: Of those, the ones that cost at most their p75 }
        median_miss_usd: { type: number, description: "Median of actual minus estimated median; positive is over" }
    JobDetail:
      type: object
      required: [job, gates, can_attach, stop, choices, can_steer, steer_note]
      properties:
        job: { $ref: "#/components/schemas/Job" }
        gates: { type: array, items: { $ref: "#/components/schemas/Gate" } }
        can_attach: { type: boolean }
        stop:
          description: Set when the build ran out of turns or budget
          oneOf: [{ $ref: "#/components/schemas/Stop" }, { type: "null" }]
        choices:
          type: array
          description: What a person can do next, once the job has ended
          items: { $ref: "#/components/schemas/Choice" }
        can_steer: { type: boolean, description: A message sent now reaches the running agent }
        steer_note: { type: string, description: "Why a running job can't take messages; empty when it can" }
    Finding:
      type: object
      required: [id, severity, file, line, claim, evidence, by, blocks, check, check_reason]
      properties:
        id: { type: string, description: "F1, F2, ...: the same across an item's review rounds" }
        severity: { type: string, description: "critical, major, minor, pre-existing" }
        file: { type: string }
        line: { type: integer }
        claim: { type: string }
        evidence: { type: string }
        by: { type: string, description: "review or critic in a paired review, else empty" }
        blocks: { type: boolean, description: The round blocks on it }
        check: { type: string, description: "The verifier's ruling: confirmed, refuted, unverified, or empty when it wasn't checked" }
        check_reason: { type: string }
    Review:
      type: object
      required: [job_id, decision, findings, challenged_assumptions]
      properties:
        job_id: { type: integer }
        decision: { type: string, description: "pass, block, questions" }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        challenged_assumptions: { type: array, items: { type: string } }
    Check:
      type: object
      required: [name, status, conclusion, url]
      properties:
        name: { type: string }
        status: { type: string }
        conclusion: { type: string }
        url: { type: string }
    PRPanel:
      type: object
      required: [pr_number, pr_url, prs, head_sha, checks, checks_error, gate_job_id, gates, review, last_job_id]
      properties:
        pr_number: { type: integer }
        pr_url: { type: string }
        prs: { type: array, items: { $ref: "#/components/schemas/LinkedPR" } }
        head_sha: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        checks_error: { type: string }
        gate_job_id: { type: [integer, "null"] }
        gates: { type: array, items: { $ref: "#/components/schemas/Gate" } }
        review:
          oneOf:
            - $ref: "#/components/schemas/Review"
            - type: "null"
        last_job_id: { type: [integer, "null"] }
    Diff:
      type: object
      required: [job_id, patch, findings]
      properties:
        job_id: { type: integer }
        patch: { type: string }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
    Preview:
      type: object
      required: [job_id, head, base, at, shots, notes]
      properties:
        job_id: { type: integer, description: The implement job that took them }
        head: { type: string }
        base: { type: string, description: "The base commit, when before screenshots were taken; else empty" }
        at: { type: string }
        shots: { type: array, items: { $ref: "#/components/schemas/PreviewShot" } }
        notes: { type: array, items: { type: string }, description: "What couldn't be captured. Quotes the app: untrusted text." }
    PreviewShot:
      type: object
      required: [url, page, viewport, side, width, height]
      properties:
        url: { type: string }
        page: { type: string }
        viewport: { type: string }
        side: { type: string, enum: [before, after] }
        width: { type: integer }
        height: { type: integer }
    Feed:
      type: object
      required: [events]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
    ActivityEntry:
      type: object
      required: [id, at, item_id, job_id, actor, ref, text, tone]
      properties:
        id: { type: integer }
        at: { type: string }
        item_id: { type: [integer, "null"] }
        job_id: { type: [integer, "null"] }
        actor: { type: string, description: "Who did it: daemon, orchestrator, human, ..." }
        ref: { type: string, description: "The item's issue as on its card; empty for none" }
        text: { type: string, description: Follows the ref }
        tone: { type: string, enum: [live, needs_you, done, bad, info] }
    Activity:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/ActivityEntry" } }
    DaySpend:
      type: object
      required: [day, cost_usd]
      properties:
        day: { type: string }
        cost_usd: { type: number }
    ModelSpend:
      type: object
      required: [model, cost_usd]
      properties:
        model: { type: string }
        cost_usd: { type: number }
    Usage:
      type: object
      description: A usage-limit window a harness last reported (subscriptions only).
      required: [harness, window, used_percent, resets_at, seen_at]
      properties:
        harness: { type: string }
        window: { type: string, description: "5h, weekly, or the CLI's own name" }
        used_percent: { type: number }
        resets_at: { type: string, description: "When it resets; empty when unknown" }
        seen_at: { type: string }
    Spend:
      type: object
      required: [days, week_usd, daily_cap_usd, by_model, usage, estimates]
      properties:
        days: { type: array, items: { $ref: "#/components/schemas/DaySpend" } }
        week_usd: { type: number }
        daily_cap_usd: { type: number }
        by_model: { type: array, items: { $ref: "#/components/schemas/ModelSpend" } }
        usage: { type: array, items: { $ref: "#/components/schemas/Usage" } }
        estimates: { $ref: "#/components/schemas/Estimates" }
    Notification:
      type: object
      required: [id, kind, title, detail, item_id, at, choice_job_id, choices]
      properties:
        id: { type: string }
        kind: { type: string, enum: [needs_input, ready_for_review, budget] }
        title: { type: string }
        detail: { type: string }
        item_id: { type: [integer, "null"] }
        at: { type: string }
        choice_job_id: { type: [integer, "null"], description: "For a parked item, the job its choices act on" }
        choices: { type: array, items: { $ref: "#/components/schemas/Choice" } }
    Notifications:
      type: object
      required: [notifications]
      properties:
        notifications: { type: array, items: { $ref: "#/components/schemas/Notification" } }
    Group:
      type: object
      required: [key, merged, cost_usd, cost_per_pr_usd]
      properties:
        key: { type: string }
        merged: { type: integer }
        cost_usd: { type: number }
        cost_per_pr_usd: { type: number }
    Week:
      type: object
      required: [start, merged, cost_usd, cost_per_merged_usd, implemented, first_pass_rate, escalation_rate]
      properties:
        start: { type: string, description: The Monday that starts the week }
        merged: { type: integer }
        cost_usd: { type: number }
        cost_per_merged_usd: { type: number }
        implemented: { type: integer }
        first_pass_rate: { type: number, description: "0..1, or -1 with no data" }
        escalation_rate: { type: number, description: "0..1, or -1 with no data" }
    Precision:
      type: object
      required: [key, findings, fixed, refuted, precision]
      properties:
        key: { type: string, description: "The reviewer's route and harness/model" }
        findings: { type: integer }
        fixed: { type: integer }
        refuted: { type: integer }
        precision: { type: number, description: "0..1, or -1 with no data" }
    Metrics:
      type: object
      required: [items, merged, closed, parked, cost_per_merged_usd, by_complexity, by_model, first_pass_rate, escalation_rate, review_blocks, security_passes, security_blocks, review_escape_rate, review_precision, precision_by_reviewer, verifier_refute_rate, rounds_to_pass, revert_window_days, revert_merged, reverted, revert_rate, broke_main, reverts_by_repo, risk_raised_by_diff, awaiting_human_hours, awaiting_human_mean_hours, weekly]
      properties:
        items: { type: integer }
        merged: { type: integer }
        closed: { type: integer }
        parked: { type: integer }
        cost_per_merged_usd: { type: number }
        by_complexity: { type: array, items: { $ref: "#/components/schemas/Group" } }
        by_model: { type: array, items: { $ref: "#/components/schemas/Group" } }
        first_pass_rate: { type: number }
        escalation_rate: { type: number }
        review_blocks: { type: integer }
        security_passes: { type: integer, description: "Security passes that ran to a verdict" }
        security_blocks: { type: integer, description: "Review rounds that blocked on a security pass's finding the verifier didn't refute" }
        review_escape_rate: { type: number }
        review_precision: { type: number, description: "Share of settled blocking findings that led to a fix, 0..1, or -1 with no data" }
        precision_by_reviewer: { type: array, items: { $ref: "#/components/schemas/Precision" } }
        verifier_refute_rate: { type: number, description: "Share of checked findings the verifier refuted, 0..1, or -1" }
        rounds_to_pass: { type: number, description: "Mean review rounds of items that passed review, or -1" }
        revert_window_days: { type: integer, description: "The days the revert rate covers" }
        revert_merged: { type: integer, description: "Factory PRs merged in that window" }
        reverted: { type: integer, description: "Of those, how many a later commit or PR reverted" }
        revert_rate: { type: number, description: "reverted / revert_merged: 0..1, or -1 with no data" }
        broke_main: { type: integer, description: "Of those, how many main health saw a check go red on" }
        reverts_by_repo: { type: array, items: { $ref: "#/components/schemas/RepoReverts" } }
        risk_raised_by_diff: { type: integer, description: "Items whose built diff raised their risk above triage's" }
        awaiting_human_hours: { type: number }
        awaiting_human_mean_hours: { type: number }
        weekly: { type: array, items: { $ref: "#/components/schemas/Week" } }
    RepoReverts:
      type: object
      required: [repo, merged, reverted, revert_rate, broke_main]
      properties:
        repo: { type: string }
        merged: { type: integer }
        reverted: { type: integer }
        revert_rate: { type: number, description: "0..1, or -1 with no data" }
        broke_main: { type: integer }
    SettingValue:
      description: A number, text, true or false, or a list of names; null when unset
      type: [number, string, boolean, array, "null"]
      items: { type: string }
    Setting:
      type: object
      required: [path, label, help, kind, options, row, value, default]
      properties:
        path: { type: array, items: { type: string }, description: "One key per level: [routing, implement.S, model]" }
        label: { type: string }
        help: { type: string }
        kind: { type: string, enum: [number, integer, text, bool, select, list, duration] }
        options: { type: array, items: { type: string }, description: "A select's choices; an empty one means the default" }
        row: { type: string, description: "The routing entry it belongs to, or empty" }
        value: { $ref: "#/components/schemas/SettingValue" }
        default: { $ref: "#/components/schemas/SettingValue" }
    SettingsGroup:
      type: object
      required: [name, help, fields]
      properties:
        name: { type: string }
        help: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/Setting" } }
    Settings:
      type: object
      required: [path, writable, reason, version, changed, restart_pending, running_jobs, groups]
      properties:
        path: { type: string, description: The config file }
        writable: { type: boolean }
        reason: { type: string, description: "Why settings can't be changed here; empty when they can" }
        version: { type: string, description: Changes whenever the file does }
        changed: { type: boolean, description: The file differs from the one the factory started with }
        restart_pending: { type: boolean }
        running_jobs: { type: integer }
        groups: { type: array, items: { $ref: "#/components/schemas/SettingsGroup" } }
    TuningChange:
      type: object
      required: [path, value, why, reason, now]
      properties:
        path: { type: array, items: { type: string }, description: "One key per level: [routing, implement.S, model]" }
        value: { $ref: "#/components/schemas/SettingValue" }
        why: { type: string, description: The numbers the change rests on }
        reason: { type: string, description: "Why the daemon dropped it; empty on a kept change" }
        now: { type: string, description: "Why a kept change wouldn't apply to factory.yaml as it is now (it already says that, say); empty when it would" }
    TuningProposal:
      type: object
      required: [id, status, created_at, period_from, period_to, summary, changes, dropped, ideas, diff, pr_url]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, applied, dismissed, superseded] }
        created_at: { type: string }
        period_from: { type: string, description: The start of the period whose metrics it read }
        period_to: { type: string }
        summary: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/TuningChange" }, description: "Settings it would change, each on the dashboard's list and leaving a valid file" }
        dropped: { type: array, items: { $ref: "#/components/schemas/TuningChange" }, description: Changes the daemon refused, with the reason }
        ideas: { type: array, items: { type: string }, description: "Prompt and skill changes, in prose, for you to make" }
        diff: { type: string, description: "The unified diff the changes would make to factory.yaml as it is now" }
        pr_url: { type: string, description: "The draft PR it opened, when tuning.repo is set; empty otherwise" }
    Tuning:
      type: object
      required: [proposal]
      properties:
        proposal:
          oneOf: [{ $ref: "#/components/schemas/TuningProposal" }, { type: "null" }]

        review: { type: string, description: "pass, block, questions, or empty when none ran" }
        findings: { type: array, items: { type: string } }
        implement_jobs: { type: integer }
        cost_usd: { type: number }
        seconds: { type: number }
        diff_stat: { type: string, description: git diff --stat against the base }
        error: { type: string }
    DaySpend:
      type: object

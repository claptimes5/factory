openapi: 3.1.0
info:
  title: Factory control room API
  version: "1"
  description: |
    The JSON API behind the dashboard at /app/, served beside the control
    room. When the control room has a password, requests without a session
    get 401 and the dashboard sends you to /login. POST requests must be application/json and
    same-origin. Every property is always present; nullable ones are null
    when unset.
servers:
  - url: /api/v1
paths:
  /overview:
    get:
      summary: Header strip shown on every screen
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Overview" } } } }
  /board:
    get:
      summary: Work items in columns by stage
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
  /items/{id}:
    get:
      summary: One item with its jobs, events, dependencies, issue text and spec
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/pr:
    get:
      summary: CI checks, gate results and the reviewer verdict for the item's PR
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PRPanel" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/diff:
    get:
      summary: The patch the latest reviewer saw, with its findings
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Diff" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/preview:
    get:
      summary: The screenshots of the item's newest build that took any
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/preview/{file}:
    get:
      summary: One screenshot, as a PNG
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: file, in: path, required: true, schema: { type: string } }
        - { name: job, in: query, description: "The build whose screenshot this is, as the shot's url names it", schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The image, content: { image/png: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/park:
    post:
      summary: Park an item with a question for the human
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /items/{id}/setup-fix:
    get:
      summary: What Fix setup would change for an item parked on a setup problem
      description: The problem it stopped on, and the change to its repo in factory.yaml that the repo's own files (Dockerfile, compose file, CI) suggest. Changes is empty when they suggest none.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: The proposal, content: { application/json: { schema: { $ref: "#/components/schemas/SetupFix" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    post:
      summary: Apply Fix setup
      description: Saves the change to factory.yaml if it is still the version shown, asks for a restart (which waits for running jobs, and lets no new one start), and queues the item's retry, which so runs on the new setup. Needs the password, or a request from this machine (403 otherwise), as settings do.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: { version: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /items/{id}/approve-estimate:
    post:
      summary: Approve an item whose cost estimate or plan waits for a human's OK
      description: One OK covers both when both wait, as factory:go does. Needs the password, or a request from this machine (403 otherwise), as settings do.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_job_id: { type: integer, description: "The plan job the page shows (Plan.job_id), when it shows one: a plan that changed since is refused (409) rather than approved unread" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /items/{id}/replan:
    post:
      summary: Ask for another plan, saying what to change, for an item whose plan waits for a human's OK
      description: What a comment and factory:replan on the issue do; the ask goes on the issue too. A plan that was already asked again parks the item. Needs the password, or a request from this machine (403 otherwise), as settings do.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_job_id, ask]
              properties:
                plan_job_id: { type: integer, description: "The plan job the page shows (Plan.job_id): a plan that changed since is refused (409)" }
                ask: { type: string, description: What to change about the plan }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /auto-merge/reset:
    post:
      summary: Reset a repo's tripped auto-merge breaker, so its PRs may merge themselves again
      description: Needs the password, or a request from this machine (403 otherwise), as settings do. PRs whose auto-merge the breaker cancelled still wait for you.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties: { repo: { type: string, description: "owner/name" } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /usage:
    get:
      summary: How much of each subscription plan's usage windows the factory's harnesses have used
      description: Only harnesses in use that run on a plan (Claude with a subscription token, Codex on a ChatGPT plan). On a plan, dollar figures are what the work would cost at API prices; the windows are what limit it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanUsage" } } } }
  /readiness:
    get:
      summary: How ready each repo is for the factory, from the readiness check's latest report
      description: Each blocker and gap comes with the issue filed for it and the factory's item for that issue.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
  /readiness/check:
    post:
      summary: Queue a readiness check of a repo
      description: |
        Queues a readiness job, which the daemon runs like any job: it clones
        the repo's base branch and runs its install and checks, as a build's
        gates do, saves the report, and files an issue for each blocker a
        change can fix, labeled for the factory. One per repo (409 while one
        is queued or running). Needs the password, or a request from this
        machine, and a daemon that can run it (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties: { repo: { type: string, description: "owner/name" } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /chats:
    get:
      summary: The chat with the orchestrator's model, whether it can reply now, and the chats so far
      description: Chat runs on the orchestrator's route and its daily budget, whether or not the orchestrator runs on its own schedule.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Chats" } } } }
    post:
      summary: Send a message and start the reply
      description: |
        chat_id 0 starts a new chat. An empty text asks again for a reply to the
        chat's last message, when it has none (after a failed reply). The reply
        is written by a read-only run that may draft issues; it is never an
        issue until a person creates the draft. One reply is written at a time
        (409 while one is, or when chat can't reply now, with why).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id: { type: integer, format: int64 }
                text: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SentChat" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /chats/{id}:
    get:
      summary: One chat, with its messages, the issues it drafted, and the reply being written
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Chat" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /drafts/{id}/create:
    post:
      summary: Open a drafted issue for the factory to build, approved by the person creating it
      description: version is the draft's version as read; 409 when it changed since (a reply revised it), so what's filed is what the person saw. A title or body given replaces the draft's. 410 when the draft was already created or dismissed; 409 when the forge refused it, with why.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                title: { type: string }
                body: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /drafts/{id}/dismiss:
    post:
      summary: Set a drafted issue aside without opening it
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /jobs/{id}:
    get:
      summary: One job with its gate results
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JobDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/log:
    get:
      summary: The job's transcript as server-sent events
      description: |
        One `line` event per log line, with data `{"text": string, "entries": [TranscriptEntry]}`:
        the line in short, and its pieces (none for bookkeeping lines). Then one `done` event
        with data `{"state": string}` once the job ends.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
  /jobs/{id}/log.jsonl:
    get:
      summary: The job's whole log as its CLI wrote it, secrets taken out, to download
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: JSON lines, content: { text/plain: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/saved-diff:
    get:
      summary: A stopped build's work against the base branch, kept on this machine
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Diff" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/continue:
    post:
      summary: Continue a build that ran out of turns or budget, in the checkout and session it kept
      description: |
        `extra` adds turns and budget as a fraction of the usual (0.5 is half as much again,
        at most 2). Adding any needs the password, or a request from this machine (403
        otherwise), as settings do. `note` goes to the builder first.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                extra: { type: number, minimum: 0, maximum: 2 }
                note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /jobs/{id}/steer:
    post:
      summary: Send a running build a message, which it reads at its next step
      description: Claude builds only; Codex reads its whole prompt when it starts.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /jobs/{id}/terminal:
    get:
      summary: A live shell in the running job's container, over WebSocket
      description: |
        Output arrives as binary frames. Send text frames holding
        `{"type":"input","data":string}` for keystrokes and
        `{"type":"resize","cols":int,"rows":int}` when the window changes.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "101": { description: Switching protocols }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /jobs/{id}/retry:
    post:
      summary: Queue the job again, optionally one model tier up
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { tier_up: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /jobs/{id}/cancel:
    post:
      summary: Cancel a queued or running job
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "409": { $ref: "#/components/responses/Action" }
  /activity:
    get:
      summary: What happened lately, said for people, newest first
      parameters:
        - name: repo
          in: query
          required: false
          schema: { type: string }
          description: Only this repo's items (owner/name), plus lines about no item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
  /orchestrator:
    get:
      summary: The orchestrator's decisions, newest first
      parameters:
        - { name: item, in: query, required: false, schema: { type: integer }, description: Only this item's decisions }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Feed" } } } }
  /metrics:
    get:
      summary: Cost per merged PR, first-pass and escalation rates, overall and per week
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Metrics" } } } }
  /compare:
    get:
      summary: "The `factory compare` runs, newest first: one issue built once per skill set"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Comparisons" } } } }
  /spend:
    get:
      summary: Spend by day (30 days, newest first) and by model
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Spend" } } } }
  /notifications:
    get:
      summary: Things the human may need to act on
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Notifications" } } } }
  /home:
    get:
      summary: "Home's catch-up: when Home was last looked at, and what went live since"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Home" } } } }
  /home/seen:
    post:
      summary: Mark Home seen now, so the catch-up starts again from here
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Home" } } } }
  /trust:
    get:
      summary: "Trust: each repo's level on the ladder toward full automation, its record and practice runs"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Trust" } } } }
    post:
      summary: Move a repo to a trust level (its auto_merge in factory.yaml), applied once the factory restarts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, level]
              properties:
                repo: { type: string }
                level: { type: integer, description: "1 to 6; 7 isn't built yet" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [message, trust]
                properties:
                  message: { type: string }
                  trust: { $ref: "#/components/schemas/Trust" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /push:
    get:
      summary: "Web push: whether this factory can push, the key a browser subscribes with, and the devices with push on"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Push" } } } }
  /push/subscribe:
    post:
      summary: Turn push on for this browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              description: "PushSubscription.toJSON(), and a name for the device"
              properties:
                endpoint: { type: string }
                keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } } }
                agent: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /push/unsubscribe:
    post:
      summary: Turn push off for a browser, by its endpoint or its id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                id: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } } }
  /push/test:
    post:
      summary: Send a test push to every device with push on
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /stream:
    get:
      summary: 'A `version` event (data `{"version": string}`) whenever anything shown changes'
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
  /settings:
    get:
      summary: The settings the dashboard may change, with factory.yaml's values
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Change settings in factory.yaml, keeping its comments
      description: |
        Only paths the GET lists are accepted. A null value removes the key,
        so the default applies. The whole file must still load, or nothing
        is written and the error says why. Changes apply when the factory
        restarts.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [changes, version]
              properties:
                changes:
                  type: array
                  items:
                    type: object
                    required: [path, value]
                    properties:
                      path: { type: array, items: { type: string } }
                      value: { $ref: "#/components/schemas/SettingValue" }
                version: { type: string, description: "The version the GET returned; a save over a file changed since is refused (409)" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/check:
    post:
      summary: What saving these changes would say, without writing
      description: |
        Checks changes against factory.yaml as it is now, as a save would,
        so the form can show what's wrong while it's edited.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  items:
                    type: object
                    required: [path, value]
                    properties:
                      path: { type: array, items: { type: string } }
                      value: { $ref: "#/components/schemas/SettingValue" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SettingsCheck" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /settings/preset:
    post:
      summary: Set how hard the factory works
      description: |
        Applies a preset's changes to factory.yaml (the model for each step,
        review strictness, escalation) for the harness that builds and the
        one that reviews: as they are, or ones named here that have a key or
        sign-in. Without a key, the current preset (Balanced when set by
        hand) is made again for the harnesses named, so this also swaps
        them. Applies when the factory restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                key: { type: string, description: "lean, balanced, thorough or maximum; empty keeps the current one" }
                builder: { type: string, description: "claude or codex; empty keeps the current one" }
                reviewer: { type: string, description: "claude or codex; empty keeps the current one" }
                version: { type: string, description: "The version the GET returned; a file changed since is refused (409)" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/restart:
    post:
      summary: Restart the factory once running jobs finish, to apply saved settings
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /settings/restart/cancel:
    post:
      summary: Call off a restart that is still waiting for jobs
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Action" }
  /settings/uninstall:
    get:
      summary: What removing the factory would remove, and what is left for you to do
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Uninstall" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Remove the factory's labels and job images, and its job data if asked
      description: |
        Deleting a label takes it off every issue and PR that has it. Refused
        while jobs run (409). The GitHub App, tokens and config files are
        never touched; the result says where to remove them.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [remove] }
                data: { type: boolean, description: "Remove the job data too (default false)" }
      responses:
        "200": { description: How each removal went, content: { application/json: { schema: { $ref: "#/components/schemas/UninstallResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/tuning:
    get:
      summary: The tuning loop's proposal waiting for you, if any
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tuning" } } } }
  /settings/tuning/{id}/apply:
    post:
      summary: Apply a tuning proposal to factory.yaml
      description: |
        Re-applies the proposal's changes to the file as it is now, through
        the same checks as a save, so edits made since are kept. Changes
        apply when the factory restarts.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: "The version the settings GET returned; a file changed since is refused (409)" }
                changes: { type: array, items: { type: integer }, description: "Indexes of the changes to apply; all of them when left out" }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/tuning/{id}/dismiss:
    post:
      summary: Dismiss a tuning proposal without changing factory.yaml
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /setup:
    get:
      summary: The get-started page, where each setup step stands
      parameters:
        - name: live
          in: query
          required: false
          description: "1 checks the forges again first (access, the app's installations, each repo's labels), unless that was done in the last 30 seconds"
          schema: { type: string, enum: ["1"] }
      description: |
        Mirrors `factory setup`. Saved secrets never come back: only whether
        each is set, and a masked hint. While the factory can't start for want
        of forge access, `factory serve` serves only this page and these
        endpoints (mode "setup"); every other endpoint answers 503 until
        Finish. Every POST under /setup needs the password, or a request from
        this machine (403 otherwise), and answers 400 with the reason when it
        refuses the input.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Wizard" } } } }
  /setup/github/app:
    post:
      summary: Start making a GitHub App with GitHub's manifest flow
      description: |
        The page posts `manifest` as a form field named manifest to `url`.
        GitHub asks the person to confirm, then sends the browser to
        /setup/github/callback with a code and the state, once.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WizardManifest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/github/callback:
    get:
      summary: Where GitHub sends the browser back once the app is made
      description: |
        Exchanges the code for the app if state is one /setup/github/app handed
        out and not yet used, saves its key next to factory.env and its ID in
        it, then redirects to /app/get-started with `github` (what happened) or
        `github_error` (why it failed) in the query.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "303": { description: Back to the get-started page }
  /setup/machine/check:
    post:
      summary: Run the checks of this machine again
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/repos:
    post:
      summary: Change which repos the factory works on, in factory.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repos]
              properties:
                repos: { type: string, description: "owner/name for GitHub, the project URL for GitLab, separated by commas" }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/checks/save:
    post:
      summary: Save a repo's install, base image and check commands to factory.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, commands]
              properties:
                repo: { type: string }
                install: { type: string }
                image_from: { type: string, description: "Empty for the default job image" }
                image_build:
                  description: Builds the job image from the repo's own Dockerfile instead of image_from; null or absent for none
                  oneOf:
                    - $ref: "#/components/schemas/ImageBuild"
                    - type: "null"
                commands: { type: object, additionalProperties: { type: string }, description: "Gate name to command; an empty command drops the gate" }
                services: { type: array, items: { type: string }, description: "The services to start, by name, from those the page shows" }
                env: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/checks/try:
    post:
      summary: Run a repo's install and each check once on its base branch, with the commands given, saved or not, in the background
      description: Clones the base branch, starts the services given, and runs the install and each check, so a wrong command or a missing service shows before you save. One run per repo at a time. The job image is the one saved; a new base image needs a save and an image build first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, commands]
              properties:
                repo: { type: string }
                install: { type: string }
                commands: { type: object, additionalProperties: { type: string } }
                services: { type: array, items: { type: string } }
                env: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/github/install-check:
    post:
      summary: Check where the GitHub App is installed; once it is on every account, save the installation and check access
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/github/existing-app:
    post:
      summary: Use a GitHub App made before
      description: GitHub must accept the ID and key; the installation is saved once the app is on every account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, key_path]
              properties:
                app_id: { type: string }
                key_path: { type: string, description: "The private key (.pem) on the factory's machine" }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/github/token:
    post:
      summary: Use a personal access token for GitHub (for a quick try)
      description: Clears the GitHub App settings, then checks access. A GitLab token (glpat-...) is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/github/disconnect:
    post:
      summary: Remove the saved GitHub token or app settings
      description: Deletes them from factory.env, so another way to connect can be chosen. A variable exported where the factory starts still applies.
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/access/check:
    post:
      summary: Check the factory can reach each repo with what is saved
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/base-branch:
    post:
      summary: Set the one repo's base_branch in factory.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, branch]
              properties:
                repo: { type: string }
                branch: { type: string }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/labels:
    post:
      summary: Create the labels the factory uses on each repo, leaving existing ones as they are
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/gitlab/token:
    post:
      summary: Save the GitLab token, then check access
      description: A GitHub token (ghp_..., github_pat_...) is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/gitlab/disconnect:
    post:
      summary: Remove the saved GitLab token
      description: Deletes it from factory.env. A GITLAB_TOKEN exported where the factory starts still applies.
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/claude:
    post:
      summary: Save Claude's API key or subscription token
      description: sk-ant-oat... is a subscription token, other sk-ant-... an API key; anything else is refused unless anyway is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
                anyway: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/claude/disconnect:
    post:
      summary: Remove Claude's saved API key or subscription token
      description: Deletes it from factory.env and routes every job to Codex if it's connected. A key exported where the factory starts still applies.
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/codex:
    post:
      summary: Choose how Codex signs in, clearing the keys Codex would use instead
      description: An empty key keeps the saved one. A ChatGPT plan then signs in with /setup/codex/sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [api-key, chatgpt, access-token] }
                key: { type: string }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/codex/disconnect:
    post:
      summary: Remove how Codex signs in
      description: |
        Deletes Codex's keys and its ChatGPT plan setting from factory.env, and
        routes every job to Claude if it's connected. The saved ChatGPT
        sign-in stays, so choosing the plan again needs no new sign-in. A key
        exported where the factory starts still applies.
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/codex/sign-in:
    post:
      summary: Sign Codex in to a ChatGPT plan with a device code, in the background
      description: |
        Runs `codex login --device-auth` (in the job image with the Docker
        runner). The link and code it prints show in codex.sign_in; once
        someone enters the code there, the sign-in is saved and Codex is set
        to the ChatGPT plan. One at a time (400 while one runs). Finish is
        refused while it runs, and a restart waits for it.
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/codex/sign-in/cancel:
    post:
      summary: Stop a running ChatGPT sign-in
      description: Stops Codex (and its container) and removes the folder it would have saved to. 400 when none is running.
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/notify:
    post:
      summary: Save the notification address (ntfy, Slack or Discord); empty turns notifications off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/notify/test:
    post:
      summary: Send a test notification to the saved address
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/sentry:
    post:
      summary: Save the Sentry token; empty removes it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/images/build:
    post:
      summary: Build the missing job images in the background, one build at a time
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /setup/finish:
    post:
      summary: Finish setup
      description: Needs access to every repo, and is refused while a job image builds or a Codex sign-in runs. In setup mode it starts the factory; otherwise it restarts it once running jobs finish, if factory.yaml or factory.env changed.
      responses:
        "200": { $ref: "#/components/responses/WizardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Action:
      description: Whether the daemon accepted the action, and why not
      content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } }
    WizardResult:
      description: What the action did, and the page after it
      content: { application/json: { schema: { $ref: "#/components/schemas/WizardResult" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    ActionResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    Overview:
      type: object
      required: [repo, repos, spent_today_usd, daily_cap_usd, awaiting, awaiting_cap, running, queued, version, disk_low, signed_in, main_health, auto_merge, plans_only]
      properties:
        plans_only: { type: boolean, description: "Every harness in use runs on a subscription plan: no job costs dollars, so show plan usage, not spend" }
        auto_merge:
          type: array
          description: Each repo's auto-merge breaker, where auto-merge is on or its breaker tripped
          items: { $ref: "#/components/schemas/Breaker" }
        main_health:
          type: array
          description: Each repo's base branch CI, as main health last read it; empty while it's off
          items: { $ref: "#/components/schemas/MainHealth" }
        disk_low: { type: string, description: "Why no job is starting for lack of disk; empty when there's room" }
        signed_in: { type: boolean, description: "The control room asks for a password (so the app can sign out)" }
        repo: { type: string, description: "the first repo; see repos" }
        repos: { type: array, items: { type: string }, description: "every repo the factory works on, as owner/name" }
        spent_today_usd: { type: number }
        daily_cap_usd: { type: number }
        awaiting: { type: integer }
        awaiting_cap: { type: integer }
        running: { type: integer }
        queued: { type: integer }
        version: { type: string }
    Breaker:
      type: object
      required: [repo, on, tripped, tripped_at, reason, strikes, threshold, window_hours, cool_off_hours, can_reset]
      properties:
        repo: { type: string }
        on: { type: boolean, description: "auto_merge lets the repo's PRs merge themselves" }
        tripped: { type: boolean, description: "The breaker turned auto-merge off until it's reset" }
        tripped_at: { type: string, description: "When it tripped; empty while it hasn't" }
        reason: { type: string, description: "The strikes that tripped it" }
        strikes: { type: integer, description: "Reverted or main-breaking factory PRs in the window since the last reset" }
        threshold: { type: integer, description: "Strikes that trip it; 0 when it never trips" }
        window_hours: { type: integer }
        cool_off_hours: { type: integer, description: "0 when only a human resets it" }
        can_reset: { type: boolean, description: "This request may reset it (tripped, and behind the password or on this machine)" }
    Chats:
      type: object
      required: [available, unavailable, model, harness, plan, orchestrator_on, orchestrator_every, run_budget_usd, daily_budget_usd, spent_today_usd, chats]
      properties:
        available: { type: boolean, description: A message sent now gets a reply }
        unavailable: { type: string, description: "Why chat can't reply now; empty when it can" }
        model: { type: string, description: "The orchestrator's model, which chat runs on" }
        harness: { type: string }
        plan: { type: boolean, description: The harness runs on a subscription plan, so dollars are what the work would cost at API prices }
        orchestrator_on: { type: boolean, description: The orchestrator also runs on its own schedule }
        orchestrator_every: { type: string, description: "How often it runs on its own, such as 1h0m0s" }
        run_budget_usd: { type: number, description: Dollars per orchestrator run or chat reply }
        daily_budget_usd: { type: number, description: Dollars per day across the orchestrator, tuning and chat }
        spent_today_usd: { type: number }
        chats: { type: array, items: { $ref: "#/components/schemas/ChatAt" }, description: The most recent first }
    ChatAt:
      type: object
      required: [id, title, updated_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        updated_at: { type: string }
    Chat:
      type: object
      required: [id, title, messages, drafts, reply]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        drafts: { type: array, items: { $ref: "#/components/schemas/Draft" } }
        reply:
          description: The run answering the last message, while it runs or when it failed; null once it answered
          oneOf: [{ $ref: "#/components/schemas/ChatReply" }, { type: "null" }]
    ChatMessage:
      type: object
      required: [id, role, text, at, job_id]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [user, assistant] }
        text: { type: string, description: Markdown }
        at: { type: string }
        job_id: { type: [integer, "null"], format: int64, description: The run that wrote a reply }
    ChatReply:
      type: object
      required: [job_id, state, error]
      properties:
        job_id: { type: integer, format: int64, description: "0 when no reply was started" }
        state: { type: string, description: "queued, running, failed, timed_out or cancelled" }
        error: { type: string }
    SentChat:
      type: object
      required: [chat_id, job_id]
      properties:
        chat_id: { type: integer, format: int64 }
        job_id: { type: integer, format: int64 }
    Draft:
      type: object
      required: [id, repo, title, body, labels, depends_on, parent, state, issue_number, issue_url, item_id, error, updated_at, version]
      properties:
        id: { type: integer, format: int64 }
        repo: { type: string }
        title: { type: string }
        body: { type: string, description: Markdown }
        labels: { type: array, items: { type: string }, description: Labels besides the intake label, which it gets when created }
        depends_on: { type: array, items: { type: integer, format: int64 }, description: Items that must be done first }
        parent: { type: [integer, "null"], format: int64, description: The epic item it is part of }
        state: { type: string, enum: [draft, creating, created, dismissed] }
        issue_number: { type: [integer, "null"] }
        issue_url: { type: string, description: "The issue's page once created; else empty" }
        item_id: { type: [integer, "null"], format: int64 }
        error: { type: string, description: "Why creating it last failed; else empty" }
        updated_at: { type: string }
        version: { type: string, description: What a create sends back, so it files the text that was read }
    PlanUsage:
      type: object
      required: [plans]
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/UsagePlan" } }
    UsagePlan:
      type: object
      required: [harness, name, plan, windows, no_reading, pause_at]
      properties:
        harness: { type: string, description: "claude or codex" }
        name: { type: string, description: "Claude, Codex" }
        plan: { type: string, description: "Claude subscription, ChatGPT plan" }
        windows:
          type: array
          description: Its latest readings, five-hour first, then weekly; empty until one arrives
          items: { $ref: "#/components/schemas/Usage" }
        no_reading: { type: string, description: "When a reading will come, while there is none; else empty" }
        pause_at: { type: number, description: "Percent of a five-hour or weekly window at which its jobs wait for the reset" }
    Readiness:
      type: object
      required: [repos, banner, intake_label, can_check, check_note]
      properties:
        repos: { type: array, items: { $ref: "#/components/schemas/RepoReadiness" } }
        banner:
          type: string
          enum: ["", not_ready, ready]
          description: "not_ready while a checked repo has blockers or its check couldn't finish; ready once every checked repo is ready and the factory has worked on nothing but their setup"
        intake_label: { type: string, description: The label that hands an issue to the factory }
        can_check: { type: boolean, description: "This request may run the check here (behind the password or on this machine, with a daemon that can)" }
        check_note: { type: string, description: "Why it can't, or empty" }
    ImageBuildRun:
      type: object
      required: [why, since, step]
      properties:
        why: { type: string, description: "Why it's built: it isn't built yet, factory.yaml changed what it's built from, the repo's Dockerfile changed" }
        since: { type: string }
        step: { type: string, description: "The Dockerfile step it's on, such as [test 3/5] COPY ...; empty before the first" }
    RepoReadiness:
      type: object
      required: [repo, state, checked_at, branch, sha, score, done, total, steps, work, extras, checking, checking_since, check_job, check_error, result, progress, checking_why, check_waits, image, last_runs]
      properties:
        repo: { type: string }
        state: { type: string, enum: [unchecked, incomplete, not_ready, ready] }
        checked_at: { type: string, description: "When the latest report's check started; empty when unchecked" }
        branch: { type: string }
        sha: { type: string }
        score: { type: integer, description: 0 to 100 }
        done: { type: integer, description: Setup steps that pass }
        total: { type: integer, description: Setup steps in all }
        steps: { type: array, items: { $ref: "#/components/schemas/ReadinessStep" } }
        work:
          type: array
          description: "The blockers the factory fixes, each filed as an issue: until they're merged, new tasks on the repo wait"
          items: { $ref: "#/components/schemas/ReadinessFinding" }
        extras:
          type: array
          description: "Gaps and tips, worth doing but not needed to start, and what's in place beyond the steps"
          items: { $ref: "#/components/schemas/ReadinessFinding" }
        checking: { type: boolean, description: "A check of the repo, a readiness job, is queued or running" }
        checking_since: { type: string }
        check_error: { type: string, description: "Why the last check failed, or empty" }
        result: { type: string, description: "What the last check did, when it worked; else empty" }
        check_job: { type: [integer, "null"], description: The readiness job of the check going, or of the last one }
        check_waits: { type: string, description: "What a check that's queued, not running, waits for (its job image to build, a free slot); empty when it runs or there's none. checking_since is then when it was queued" }
        image:
          description: The build of its job image going now, or null; its jobs, its check included, wait for it
          oneOf:
            - $ref: "#/components/schemas/ImageBuildRun"
            - type: "null"
        checking_why: { type: string, description: "What started the run going, when the factory did by itself; else empty" }
        progress:
          type: array
          description: What the check going (or the last one) has done so far, a step at a time, oldest first
          items: { $ref: "#/components/schemas/ReadinessProgress" }
        last_runs:
          type: array
          description: The commands the last finished check ran, in order, so a check going can show what's still to come and how long each took then
          items: { $ref: "#/components/schemas/ReadinessRun" }
    ReadinessRun:
      type: object
      required: [gate, command, passed, seconds]
      properties:
        gate: { type: string, description: "install, types, lint, test, ..." }
        command: { type: string }
        passed: { type: boolean }
        seconds: { type: number }
    ReadinessStep:
      type: object
      required: [key, title, why, state, passed, blockers]
      properties:
        key: { type: string, enum: [access, run] }
        title: { type: string }
        why: { type: string, description: What the factory needs it for }
        state: { type: string, enum: [done, failing, unchecked] }
        passed: { type: string, description: "What the check saw when it's done, or empty" }
        blockers: { type: array, items: { $ref: "#/components/schemas/ReadinessFinding" } }
    ReadinessProgress:
      type: object
      required: [at, text]
      properties:
        at: { type: string, description: When it was said }
        text: { type: string, description: "A step: running `bundle install`, passed `bundle install` in 2m14s" }
    ReadinessFinding:
      type: object
      required: [key, level, area, title, detail, issue, issue_url, status, split_done, split_total, item_id, item_stage]
      properties:
        key: { type: string, description: "What it's about across checks (check:lint, flaky), or empty with nothing to file" }
        level: { type: string, enum: [blocker, gap, tip, good] }
        area: { type: string }
        title: { type: string, description: "Markdown: code spans in backticks" }
        detail: { type: string, description: "Markdown, with command output in fenced blocks" }
        issue: { type: integer, description: 0 when none is filed }
        issue_url: { type: string }
        status:
          type: string
          enum: [none, not_filed, not_queued, closed, waiting, building, needs_you, split, done]
          description: "The work on it: none when there's nothing to file (yours to fix, or in place); split when its item was split into smaller issues"
        split_done: { type: integer, description: "Of a split item's issues, how many are done" }
        split_total: { type: integer, description: "How many issues a split item was split into" }
        item_id: { type: ["integer", "null"] }
        item_stage: { type: string }
    MainHealth:
      type: object
      required: [repo, branch, state, sha, detail, checks]
      properties:
        repo: { type: string }
        branch: { type: string }
        state: { type: string, enum: [green, red, flaky, pending, no_ci, unreadable] }
        sha: { type: string, description: the branch head it read }
        detail: { type: string, description: "the red, flaky or pending checks, or why CI can't be read" }
        checks:
          type: array
          description: The red and flaky checks it tracks, with the issue filed for each
          items:
            type: object
            required: [check, kind, issue, issue_url]
            properties:
              check: { type: string }
              kind: { type: string, enum: [red, flaky] }
              issue: { type: integer, description: 0 until filed (the day's cap was reached) }
              issue_url: { type: string }
    Item:
      type: object
      required: [id, repo, ref, issue, title, stage, complexity, risk, priority, parent_id, branch, pr_number, prs, created_at, updated_at, issue_url, pr_url, needs_you, self_started, blocked_note, estimate, estimate_waiting, plan_waiting, choice_job_id, choices, waits_for, unblocks, setup, setup_note]
      properties:
        id: { type: integer }
        repo: { type: string, description: "owner/name" }
        ref: { type: string, description: "how to show the issue: #12, or owner/name#12 when there are several repos" }
        issue: { type: integer }
        title: { type: string }
        stage: { $ref: "#/components/schemas/Stage" }
        complexity: { type: string, description: "XS, S, M, L, or empty before triage" }
        risk: { type: string }
        priority: { type: integer }
        parent_id: { type: [integer, "null"] }
        branch: { type: string }
        pr_number: { type: integer, description: 0 when there is no PR }
        prs:
          type: array
          description: A workspace change's PRs, one per repo it touches, in merge order; empty otherwise
          items: { $ref: "#/components/schemas/LinkedPR" }
        created_at: { type: string }
        updated_at: { type: string }
        issue_url: { type: string }
        pr_url: { type: string }
        needs_you: { type: boolean, description: Awaiting review, parked, or waiting for an OK on its cost }
        self_started: { type: string, description: "The finding the factory started it from on its own (main_health, dependabot, todos, sentry, hunt, orchestrator), or empty when a person asked for it" }
        blocked_note: { type: string, description: Why it is parked or blocked }
        estimate: { type: string, description: "Triage's cost estimate in a line: $1.80–$3.10, on your plan, or empty" }
        estimate_waiting: { type: boolean, description: It waits for your OK on its cost estimate }
        plan_waiting: { type: boolean, description: It waits for your OK on its plan }
        choice_job_id: { type: [integer, "null"], description: "The job a parked item's choices act on; null unless it is parked" }
        choices:
          type: array
          description: What a person can do next with a parked item, each explained; empty unless it is parked
          items: { $ref: "#/components/schemas/Choice" }
        waits_for:
          type: array
          description: "The items it depends on that aren't done: it isn't built until they are, whatever is approved"
          items: { $ref: "#/components/schemas/ItemRef" }
        unblocks:
          type: array
          description: "The items not done that wait for it: what it holds up"
          items: { $ref: "#/components/schemas/ItemRef" }
        setup: { type: string, enum: ["", blocks, held, image, base], description: "While the repo's readiness check has found blockers: blocks when it fixes one, held when it waits for them; image when its jobs wait for its job image to build; base when it's parked on checks that fail on the base branch too; else empty" }
        setup_note: { type: string, description: "Why, in a sentence" }
    ItemRef:
      type: object
      required: [id, ref]
      properties:
        id: { type: integer }
        ref: { type: string }
    Choice:
      type: object
      required: [action, label, model, explain, available, why]
      properties:
        action: { type: string, enum: [fix_setup, continue, retry, tier_up, park] }
        label: { type: string }
        model: { type: string, description: "harness/model it would run on; empty for park" }
        explain: { type: string, description: What it does, in plain words }
        available: { type: boolean }
        why: { type: string, description: Why it isn't available }
    Stop:
      type: object
      description: How a build that ran out of turns or budget stopped
      required: [reason, summary, turns, max_turns, cost_usd, budget_usd, note, kept, saved_diff]
      properties:
        reason: { type: string, enum: [turns, budget] }
        summary: { type: string }
        turns: { type: integer }
        max_turns: { type: integer }
        cost_usd: { type: number }
        budget_usd: { type: number }
        note: { type: string, description: What the builder wrote down before it stopped }
        kept: { type: boolean, description: Its checkout is still there to continue in }
        saved_diff: { type: boolean, description: "Its work against the base branch can be read at /jobs/{id}/saved-diff" }
    TranscriptEntry:
      type: object
      description: One piece of a run's transcript, structured from its CLI's JSON log
      required: [kind, text, tool, tool_id, summary, input, output, truncated, is_error, model, tools, subtype, turns, cost_usd, delivered]
      properties:
        kind: { type: string, enum: [init, text, thinking, tool, tool_result, you, outcome, error] }
        text: { type: string, description: "The agent's words, its thinking, your message, an error, or (outcome) its final message" }
        tool: { type: string }
        tool_id: { type: string, description: A tool call's id; its result carries the same }
        summary: { type: string, description: "What a tool call did, in a line (Ran go test ./..., Read a.go), or how the run ended" }
        input: { type: string, description: "A tool call's whole input" }
        output: { type: string, description: "A tool result's output, cut at 20000 bytes" }
        truncated: { type: boolean }
        is_error: { type: boolean }
        model: { type: string }
        tools: { type: integer }
        subtype: { type: string, description: "outcome: the CLI's own word for how it ended (success, error_max_turns)" }
        turns: { type: integer }
        cost_usd: { type: number }
        delivered: { type: boolean, description: "you: false when the agent had already finished" }
    LinkedPR:
      type: object
      required: [repo, number, ref, url]
      properties:
        repo: { type: string }
        number: { type: integer }
        ref: { type: string, description: "How to show it: web#12" }
        url: { type: string }
    Stage:
      type: string
      enum: [epic, triage, spec, ready, implementing, reviewing, awaiting_human, parked, blocked, done]
    Card:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [model, cost_usd, live, live_job, live_kind, live_since, activity, attempt, gates_passed, gates_total]
          properties:
            model: { type: string }
            cost_usd: { type: number }
            live: { type: boolean }
            live_job: { type: [integer, "null"] }
            live_kind: { type: string, description: "The running job's kind (implement, review, ...), or empty" }
            live_since: { type: string, description: When the running job started }
            activity: { type: string, description: "What the running job is doing now, from its log: editing parser/parser.go" }
            attempt: { type: integer, description: The latest implement attempt, 0 before the first }
            gates_passed: { type: integer }
            gates_total: { type: integer, description: "Gates the latest implement attempt ran: 0 before any, if it never reached them, or once the item is done" }
    Column:
      type: object
      required: [stage, cards]
      properties:
        stage: { $ref: "#/components/schemas/Stage" }
        cards: { type: array, items: { $ref: "#/components/schemas/Card" } }
    Board:
      type: object
      required: [columns]
      properties:
        columns: { type: array, items: { $ref: "#/components/schemas/Column" } }
    Job:
      type: object
      required: [id, item_id, kind, state, harness, model, effort, attempt, cost_usd, budget_usd, tokens_in, tokens_out, verdict, error, queued_at, started_at, finished_at, branch, skillset, head_sha]
      properties:
        id: { type: integer }
        item_id: { type: [integer, "null"] }
        kind: { type: string, description: "triage, implement, review, critic, orchestrate" }
        state: { type: string, description: "queued, running, succeeded, failed, cancelled, interrupted, ..." }
        harness: { type: string }
        model: { type: string }
        effort: { type: string }
        attempt: { type: integer }
        cost_usd: { type: number }
        budget_usd: { type: number }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        verdict: { type: string, description: The stage's raw JSON verdict }
        error: { type: string }
        queued_at: { type: string }
        started_at: { type: string }
        finished_at: { type: string }
        branch: { type: string }
        skillset: { type: string }
        head_sha: { type: string }
    Gate:
      type: object
      required: [gate, status, detail]
      properties:
        gate: { type: string }
        status: { type: string, description: "pass, fail, misconfigured" }
        detail: { type: string }
    Event:
      type: object
      required: [id, at, actor, item_id, job_id, type, reason, data]
      properties:
        id: { type: integer }
        at: { type: string }
        actor: { type: string }
        item_id: { type: [integer, "null"] }
        job_id: { type: [integer, "null"] }
        type: { type: string }
        reason: { type: string }
        data: { type: string, description: JSON }
    ItemDetail:
      type: object
      required: [item, jobs, events, depends_on, issue_body, spec, estimate, plan, risk_reasons, needs_person, happened, split, children]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        depends_on: { type: array, items: { type: integer } }
        issue_body: { type: string }
        spec: { type: string }
        risk_reasons:
          type: array
          description: 'Every reason the rating of the latest build''s diff found, with the level it rates the change at, whether or not it raised the item''s risk: "high: adds or changes a migration: `db/1.sql`"'
          items: { type: string }
        needs_person:
          type: array
          description: "Why the latest build waits for you whatever its risk (risk.needs_person); empty when nothing does"
          items: { type: string }
        estimate:
          oneOf:
            - $ref: "#/components/schemas/Estimate"
            - type: "null"
        plan:
          description: The plan of the item's current triage cycle; null when there is none or it isn't written yet
          oneOf:
            - $ref: "#/components/schemas/Plan"
            - type: "null"
        happened:
          description: How a stopped, failed or parked item got there, from its jobs and events; null for one that hasn't stopped
          oneOf:
            - $ref: "#/components/schemas/Happened"
            - type: "null"
        split:
          description: The Split it button, for an item whose build failed or ran out of turns, or that was parked; null otherwise
          oneOf:
            - $ref: "#/components/schemas/Split"
            - type: "null"
        children: { type: array, description: "The issues it was split into, oldest first", items: { $ref: "#/components/schemas/Item" } }
    Happened:
      type: object
      required: [summary, steps, note]
      properties:
        summary: { type: string, description: "The whole story in a sentence: The build ran out of turns (job #12), then its retry was cancelled by you (job #14)." }
        steps: { type: array, items: { $ref: "#/components/schemas/HappenedStep" }, description: Its parts in order, each with its job to link }
        note: { type: string, description: "What to do when the last build failed a check that fails on the base branch too, as the setup check found; empty otherwise" }
    HappenedStep:
      type: object
      required: [text, job_id]
      properties:
        text: { type: string }
        job_id: { type: [integer, "null"], format: int64 }
    Split:
      type: object
      required: [prompt, unavailable]
      properties:
        prompt: { type: string, description: The chat message that asks for smaller issues, each with this item as parent }
        unavailable: { type: string, description: "Why chat can't take it now, or empty" }
    Uninstall:
      type: object
      required: [labels, repos, kept, images, images_note, data, manual, refused, writable, reason]
      properties:
        kept: { type: array, items: { $ref: "#/components/schemas/UninstallKept" }, description: "What looks like the factory's but stays, with why: a GitLab group's label, an intake label you made, a runner image not marked as the factory's" }
        labels: { type: array, items: { $ref: "#/components/schemas/UninstallLabel" }, description: "The factory's labels on each repo. Deleting one takes it off every issue and PR that has it" }
        repos: { type: array, items: { $ref: "#/components/schemas/UninstallRepo" }, description: Repos whose labels couldn't be read }
        images: { type: array, items: { $ref: "#/components/schemas/UninstallImage" }, description: "The job images the factory built, old copies included" }
        images_note: { type: string, description: "Why no images could be listed, or empty" }
        data: { $ref: "#/components/schemas/UninstallData" }
        manual: { type: array, items: { $ref: "#/components/schemas/UninstallStep" }, description: "What the factory can't do for you: the GitHub App, tokens, its config files" }
        refused: { type: string, description: "Why nothing can be removed now (jobs running), or empty" }
        writable: { type: boolean }
        reason: { type: string, description: "Why this request may not remove anything, or empty" }
    UninstallLabel:
      type: object
      required: [repo, name, open, open_capped]
      properties:
        repo: { type: string }
        name: { type: string }
        open: { type: integer, description: "Open issues and PRs with it; -1 when it couldn't be counted" }
        open_capped: { type: boolean, description: "Counting stopped at open, so there are at least that many" }
    UninstallKept:
      type: object
      required: [what, why]
      properties:
        what: { type: string }
        why: { type: string }
    UninstallRepo:
      type: object
      required: [repo, error]
      properties:
        repo: { type: string }
        error: { type: string }
    UninstallImage:
      type: object
      required: [ref, id, size, dangling]
      properties:
        ref: { type: string, description: "Its tag, or its ID for an old untagged copy" }
        id: { type: string }
        size: { type: string }
        dangling: { type: boolean }
    UninstallData:
      type: object
      required: [path, exists, size, what, note, blocked]
      properties:
        path: { type: string }
        exists: { type: boolean }
        size: { type: string }
        what: { type: string, description: What removing it here removes }
        note: { type: string, description: "What stays and why, or empty" }
        blocked: { type: string, description: "Why it can't be removed (it may not be the factory's alone), or empty" }
    UninstallStep:
      type: object
      required: [text, url]
      properties:
        text: { type: string }
        url: { type: string, description: "A link, or empty" }
    UninstallResult:
      type: object
      required: [done, manual]
      properties:
        done: { type: array, items: { $ref: "#/components/schemas/UninstallDone" } }
        manual: { type: array, items: { $ref: "#/components/schemas/UninstallStep" } }
    UninstallDone:
      type: object
      required: [what, ok, error]
      properties:
        what: { type: string }
        ok: { type: boolean }
        error: { type: string }
    Plan:
      type: object
      required: [job_id, ask, approach, files, risks, tests, waiting, approved_by, replan_of, can_approve]
      properties:
        job_id: { type: integer, description: The plan job }
        ask: { type: string, description: "The call the plan needs from the person, with its recommendation; empty on plans from before it was asked" }
        approach: { type: string }
        files: { type: array, items: { type: string }, description: The files it expects to touch }
        risks: { type: array, items: { type: string } }
        tests: { type: string }
        waiting: { type: boolean, description: It waits for your OK }
        approved_by: { type: string, description: "How it was approved (by @x, from the dashboard, by the critic), or empty" }
        replan_of: { type: string, description: "Who asked for this plan in place of an earlier one (@x, the critic), or empty for a first plan. The factory plans again only once, so asking for changes to this one parks the item" }
        can_approve: { type: boolean, description: "It waits, and this request may approve it or ask for another plan here (the password, or a request from this machine); else the factory:go and factory:replan labels it is" }
    Estimate:
      type: object
      required: [range, detail, status, size, median_usd, p75_usd, total_median_usd, total_p75_usd, threshold_usd, basis, samples, approved_by, created_at, actual_usd, finished, can_approve]
      properties:
        range: { type: string, description: "Median to p75 in a line: $1.80–$3.10, + plan usage, or on your plan" }
        detail: { type: string, description: "What it's based on: based on 14 past M items in o/api: median $1.80, p75 $3.10" }
        status: { type: string, enum: [off, under, exempt, waiting, parked, approved], description: "parked: parked while it waited, so it still needs an OK" }
        size: { type: string }
        median_usd: { type: number, description: Billed dollars }
        p75_usd: { type: number, description: Billed dollars; compared with threshold_usd }
        total_median_usd: { type: number, description: All the work, plan runs at the cost they report }
        total_p75_usd: { type: number }
        threshold_usd: { type: number, description: "confirm_over for its repo; 0 is off" }
        basis: { type: string, enum: [repo, all, default] }
        samples: { type: integer }
        approved_by: { type: string }
        created_at: { type: string }
        actual_usd: { type: number, description: "What building it has cost so far in this estimate's cycle (since its triage), triage left out" }
        finished: { type: boolean, description: The build is over, so actual_usd can be compared }
        can_approve: { type: boolean, description: "It waits, and this request may approve it here (the password, or a request from this machine); else the factory:go label it is" }
    Estimates:
      type: object
      required: [compared, within, median_miss_usd]
      properties:
        compared: { type: integer, description: Finished builds with an estimate }
        within: { type: integer, description: Of those, the ones that cost at most their p75 }
        median_miss_usd: { type: number, description: "Median of actual minus estimated median; positive is over" }
    JobDetail:
      type: object
      required: [job, gates, can_attach, stop, choices, can_steer, steer_note]
      properties:
        job: { $ref: "#/components/schemas/Job" }
        gates: { type: array, items: { $ref: "#/components/schemas/Gate" } }
        can_attach: { type: boolean }
        stop:
          description: Set when the build ran out of turns or budget
          oneOf: [{ $ref: "#/components/schemas/Stop" }, { type: "null" }]
        choices:
          type: array
          description: What a person can do next, once the job has ended
          items: { $ref: "#/components/schemas/Choice" }
        can_steer: { type: boolean, description: A message sent now reaches the running agent }
        steer_note: { type: string, description: "Why a running job can't take messages; empty when it can" }
    Finding:
      type: object
      required: [id, severity, file, line, claim, evidence, by, blocks, check, check_reason]
      properties:
        id: { type: string, description: "F1, F2, ...: the same across an item's review rounds" }
        severity: { type: string, description: "critical, major, minor, pre-existing" }
        file: { type: string }
        line: { type: integer }
        claim: { type: string }
        evidence: { type: string }
        by: { type: string, description: "review or critic in a paired review, else empty" }
        blocks: { type: boolean, description: The round blocks on it }
        check: { type: string, description: "The verifier's ruling: confirmed, refuted, unverified, or empty when it wasn't checked" }
        check_reason: { type: string }
    Review:
      type: object
      required: [job_id, decision, findings, challenged_assumptions]
      properties:
        job_id: { type: integer }
        decision: { type: string, description: "pass, block, questions" }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        challenged_assumptions: { type: array, items: { type: string } }
    Check:
      type: object
      required: [name, status, conclusion, url]
      properties:

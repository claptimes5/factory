        repos: { type: array, items: { $ref: "#/components/schemas/UninstallRepo" }, description: Repos whose labels couldn't be read }
        images: { type: array, items: { $ref: "#/components/schemas/UninstallImage" }, description: "The job images the factory built, old copies included" }
        images_note: { type: string, description: "Why no images could be listed, or empty" }
        data: { $ref: "#/components/schemas/UninstallData" }
        manual: { type: array, items: { $ref: "#/components/schemas/UninstallStep" }, description: "What the factory can't do for you: the GitHub App, tokens, its config files" }
        refused: { type: string, description: "Why nothing can be removed now (jobs running), or empty" }
        writable: { type: boolean }
        reason: { type: string, description: "Why this request may not remove anything, or empty" }
    UninstallLabel:
      type: object
      required: [repo, name, open, open_capped]
      properties:
        repo: { type: string }
        name: { type: string }

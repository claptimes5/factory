{{define "head"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory · {{.Page}}</title>
<script src="/static/htmx.min.js"></script><script src="/static/sse.js"></script>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--line:#e7e5e4;--card:#fff;--acc:#2563eb;--bad:#dc2626;--ok:#16a34a;--warn:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#e7e5e4;--mut:#a8a29e;--line:#292524;--card:#1c1917;--acc:#60a5fa;--bad:#f87171;--ok:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
nav{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
nav a{color:var(--mut);text-decoration:none}nav a.on{color:var(--fg);font-weight:600}nav b{margin-right:8px}
main{padding:16px;max-width:1200px;margin:auto}a{color:var(--acc)}h1{font-size:20px}h2{font-size:16px;margin-top:24px}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500}
.wrap{overflow-x:auto}.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.cols{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.col{min-width:220px;flex:1}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto;font-size:13px;white-space:pre-wrap}
#log{font:12px/1.4 ui-monospace,monospace;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:60vh;overflow:auto}
.l{border-bottom:1px dotted var(--line);padding:2px 0;word-break:break-word}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
form{display:inline}.msg{padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
</style></head><body>
<nav><b>Factory</b>
<a href="/" class="{{if eq .Page "home"}}on{{end}}">Needs you</a>
<a href="/board" class="{{if eq .Page "board"}}on{{end}}">Board</a>
<a href="/orchestrator" class="{{if eq .Page "orchestrator"}}on{{end}}">Orchestrator</a>
<a href="/spend" class="{{if eq .Page "spend"}}on{{end}}">Spend</a>
<a href="/metrics" class="{{if eq .Page "metrics"}}on{{end}}">Metrics</a>
<a href="/compare" class="{{if or (eq .Page "compare") (eq .Page "compare_view")}}on{{end}}">Compare</a>
{{if .SignedIn}}<form method="post" action="/logout"><button>Sign out</button></form>{{end}}
</nav><main>{{end}}
{{define "foot"}}</main></body></html>{{end}}
{{define "issue"}}<a href="{{issueURL .Repo .IssueNumber}}">{{ref .Repo .IssueNumber}}</a>{{end}}
{{define "pr"}}<a href="{{prURL .Repo .PRNumber}}">PR {{ref .Repo .PRNumber}}</a>{{end}}

name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # The race-enabled tests are the long pole; vet, build and lint run
  # beside them in their own job instead of after them.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Each job lists different files so it keeps its own build cache
          # (this one with -race) instead of racing the others for one key.
          cache-dependency-path: go.sum
      - name: test
        run: go test -race ./...
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .golangci.yml
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image carries the browsers and the system libraries they
    # need, so no run waits on an apt mirror. Its tag must match the
    # @playwright/test version in web/package-lock.json.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The container runs as root over a checkout it doesn't own.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            web/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: playwright image matches @playwright/test
        run: grep -q "playwright:v$(node -p "require('@playwright/test/package.json').version")-noble" ../.github/workflows/ci.yml
      # The built app and the generated API types are committed so the Go
      # build needs no Node; fail if either is stale.
      - name: build
        run: npm run build
      - name: built app and types are up to date
        run: |
          git status --porcelain -- . ../internal/web/app
          test -z "$(git status --porcelain -- . ../internal/web/app)"
      - name: playwright (desktop and phone)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

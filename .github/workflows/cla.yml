name: cla
on:
  issue_comment:
    types: [created]
  # pull_request_target so the check can comment and record signatures on
  # pull requests from forks. It never checks out the pull request's code.
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The signatures branch has to exist before the first signature;
      # make it from the default branch the first time.
      - name: signatures branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/git/refs/heads/cla-signatures" >/dev/null 2>&1 ||
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$SHA" >/dev/null
      # v2.6.1
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          # Signatures live on their own branch, so recording one never
          # needs a push to main.
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          # Bots (the factory's own GitHub App included) don't sign.
          allowlist: claptimes5,*[bot]
